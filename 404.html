<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 | Xi Han</title>
    <link rel="stylesheet" href="./assets/css/font-awesome-6.0.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: "Inter", "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #0f1324 0%, #1a1f3a 25%, #0d0f1f 50%, #1a1f3a 75%, #0f1324 100%);
            background-attachment: fixed;
            color: #f5f5ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(184, 160, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(100, 200, 255, 0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(22, 28, 48, 0.92);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 40px;
            max-width: 640px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            backdrop-filter: blur(14px);
        }

        .error-icon {
            font-size: 4rem;
            color: #b8a0ff;
            margin-bottom: 16px;
            display: block;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .error-code {
            font-size: 6rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #b8a0ff, #64c8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            line-height: 1;
        }

        @media (max-width: 480px) {
            .error-code { font-size: 4rem; }
            .error-icon { font-size: 3rem; }
        }

        .error-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #f5f5ff;
            margin-bottom: 12px;
        }

        .error-message {
            font-size: 1rem;
            color: rgba(255,255,255,0.6);
            margin-bottom: 24px;
            line-height: 1.7;
        }

        .search-container {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .search-title {
            color: #d8c4ff;
            font-size: 1rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            font-weight: 600;
        }

        .search-title i { color: #b8a0ff; }

        .search-form {
            display: flex;
            gap: 10px;
        }

        .search-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            font-size: 0.95rem;
            background: rgba(0,0,0,0.25);
            color: #f5f5ff;
            outline: none;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        .search-input:focus {
            border-color: #b8a0ff;
            box-shadow: 0 0 0 3px rgba(184,160,255,0.1);
        }

        .search-input::placeholder { color: rgba(255,255,255,0.25); }

        .search-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #b8a0ff, #8b6fe8);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.25s ease;
            font-size: 1rem;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(184,160,255,0.3);
        }

        .action-buttons {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            justify-content: center;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #b8a0ff, #8b6fe8);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(184,160,255,0.3);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
            color: #f5f5ff;
            transform: translateY(-2px);
        }

        .footer-info {
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.4);
            font-size: 0.85rem;
            line-height: 1.8;
        }

        .footer-info a {
            color: #b8a0ff;
            text-decoration: none;
            font-weight: 500;
        }

        .footer-info a:hover {
            text-decoration: underline;
            color: #d0bfff;
        }

        @media (max-width: 768px) {
            body { padding: 16px; }
            .container { padding: 28px 20px; border-radius: 18px; }
            .error-code { font-size: 4.5rem; }
            .error-title { font-size: 1.3rem; }
            .action-buttons { flex-direction: column; }
            .btn { width: 100%; }
            .search-form { flex-direction: column; }
            .search-input, .search-btn { width: 100%; }
        }

        @media (min-width: 768px) {
            body { padding: 6vh 24px; }
            .container { border-radius: 32px; padding: 48px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <i class="fas fa-exclamation-triangle error-icon"></i>
        
        <div class="error-code">404</div>
        
        <h1 class="error-title">页面未找到</h1>
        
        <p class="error-message">
            抱歉，您访问的页面不存在或已被移动。<br>
            请检查网址是否正确，或尝试其他方式找到您需要的内容。
        </p>

        <div class="search-container">
            <h3 class="search-title">
                <i class="fas fa-search"></i>
                搜索内容
            </h3>
            <div class="search-form">
                <input type="text" class="search-input" placeholder="输入搜索关键词..." id="searchInput">
                <button class="search-btn" onclick="performSearch()">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>

        <div class="action-buttons">
            <a href="index.html" class="btn btn-primary">
                <i class="fas fa-home"></i>
                返回首页
            </a>
            <button class="btn btn-secondary" onclick="goBack()">
                <i class="fas fa-arrow-left"></i>
                返回上页
            </button>
        </div>

        <div class="footer-info">
            <p>如果问题持续存在，请联系 <a href="mailto:a@xi-han.top">a@xi-han.top</a></p>
            <p>或访问 <a href="index.html">Xi Han 主页</a> 获取更多帮助</p>
        </div>
    </div>

    <script>
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                window.open(`https://www.google.com/search?q=site:${window.location.hostname} ${encodeURIComponent(query)}`, '_blank');
            } else {
                alert('请输入搜索关键词');
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') performSearch();
        });

        document.addEventListener('DOMContentLoaded', function() {
            const c = document.querySelector('.container');
            c.style.opacity = '0';
            c.style.transform = 'translateY(20px)';
            setTimeout(() => {
                c.style.transition = 'all 0.6s ease';
                c.style.opacity = '1';
                c.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body>
</html>
