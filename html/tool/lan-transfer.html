<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0f1324" />
<title>局域网文件互传</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:"Inter","Microsoft YaHei","PingFang SC",sans-serif;
  background:
    linear-gradient(
      135deg,
      #0f1324 0%,
      #1a1f3a 25%,
      #0d0f1f 50%,
      #1a1f3a 75%,
      #0f1324 100%
    );
  color:#fff;
  min-height:100vh;
  padding:20px;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 20% 50%, rgba(184,160,255,.08), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(100,200,255,.06), transparent 50%);
}

.page{
  position:relative;
  z-index:1;
  max-width:900px;
  margin:auto;
}

.card{
  background:rgba(22,28,48,.92);
  border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(14px);
  border-radius:28px;
  padding:28px;
  box-shadow:
    0 20px 60px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.1);
}

.header{
  text-align:center;
  margin-bottom:20px;
}

.header i{
  font-size:2.5rem;
  color:#82dcaa;
  margin-bottom:10px;
}

h1{
  font-size:2rem;
  font-weight:800;
  margin-bottom:5px;
  background:linear-gradient(135deg,#82dcaa,#64c8ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.sub{
  color:rgba(255,255,255,.45);
  font-size:.9rem;
}

.tabs{
  display:flex;
  border-radius:14px;
  overflow:hidden;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  margin-bottom:18px;
}

.tab{
  flex:1;
  padding:14px;
  border:none;
  cursor:pointer;
  background:transparent;
  color:rgba(255,255,255,.4);
  font-size:.95rem;
  font-weight:700;
  transition:.25s;
}

.tab.active.send{
  background:rgba(130,220,170,.12);
  color:#82dcaa;
}

.tab.active.recv{
  background:rgba(100,200,255,.12);
  color:#64c8ff;
}

.panel{
  display:none;
}

.panel.active{
  display:block;
}

.conn{
  display:flex;
  align-items:center;
  gap:8px;
  padding:12px 14px;
  border-radius:12px;
  margin-bottom:16px;
  font-size:.86rem;
}

.conn.idle{
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.06);
  color:rgba(255,255,255,.4);
}

.conn.wait{
  background:rgba(255,200,100,.08);
  border:1px solid rgba(255,200,100,.15);
  color:#ffc864;
}

.conn.ok{
  background:rgba(130,220,170,.08);
  border:1px solid rgba(130,220,170,.15);
  color:#82dcaa;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:currentColor;
}

.room{
  display:none;
  text-align:center;
  margin-bottom:15px;
}

.room.show{
  display:block;
}

.room-code{
  font-size:2.6rem;
  font-weight:900;
  letter-spacing:.15em;
  margin:8px 0;
  color:#82dcaa;
  font-family:Consolas,monospace;
}

.drop{
  border:2px dashed rgba(130,220,170,.2);
  border-radius:16px;
  padding:30px 20px;
  text-align:center;
  transition:.25s;
  cursor:pointer;
  background:rgba(130,220,170,.03);
  margin-bottom:14px;
}

.drop.drag{
  border-color:#82dcaa;
  background:rgba(130,220,170,.07);
}

.drop i{
  font-size:2.5rem;
  color:#82dcaa;
  margin-bottom:10px;
}

.drop p{
  color:rgba(255,255,255,.55);
}

.files{
  max-height:250px;
  overflow:auto;
  margin-bottom:12px;
}

.file{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border-radius:10px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.06);
  margin-bottom:6px;
}

.file i{
  color:#82dcaa;
}

.file-info{
  flex:1;
  min-width:0;
}

.file-name{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:.85rem;
}

.file-size{
  font-size:.72rem;
  color:rgba(255,255,255,.35);
}

.empty{
  text-align:center;
  padding:15px;
  color:rgba(255,255,255,.2);
  font-size:.85rem;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  border:none;
  border-radius:12px;
  padding:12px 20px;
  cursor:pointer;
  font-weight:700;
  font-size:.92rem;
  transition:.25s;
}

.btn:hover{
  transform:translateY(-2px);
}

.green{
  background:linear-gradient(135deg,#82dcaa,#5cc48a);
  color:#fff;
}

.blue{
  background:linear-gradient(135deg,#64c8ff,#3498db);
  color:#fff;
}

.red{
  background:rgba(255,107,107,.08);
  color:#ff6b6b;
  border:1px solid rgba(255,107,107,.15);
}

.progress{
  display:none;
  margin-bottom:12px;
}

.progress.show{
  display:block;
}

.bar{
  width:100%;
  height:6px;
  border-radius:999px;
  overflow:hidden;
  background:rgba(255,255,255,.06);
}

.fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#82dcaa,#64c8ff);
  transition:.2s;
}

.progress-info{
  display:flex;
  justify-content:space-between;
  margin-top:5px;
  font-size:.75rem;
  color:rgba(255,255,255,.45);
}

.input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(0,0,0,.25);
  color:#64c8ff;
  outline:none;
  text-align:center;
  letter-spacing:.25em;
  font-size:1.3rem;
  font-weight:800;
  margin-bottom:12px;
}

.recv-list{
  margin-top:14px;
}

.recv-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border-radius:10px;
  background:rgba(130,220,170,.04);
  border:1px solid rgba(130,220,170,.1);
  margin-bottom:6px;
}

.recv-item a{
  color:#82dcaa;
  text-decoration:none;
  font-weight:700;
}

.toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  opacity:0;
  transition:.3s;
  padding:12px 18px;
  border-radius:12px;
  background:rgba(22,28,48,.95);
  border:1px solid rgba(130,220,170,.25);
  color:#82dcaa;
  z-index:999;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media(max-width:768px){
  .card{
    padding:18px;
    border-radius:20px;
  }

  .actions{
    flex-direction:column;
  }

  .room-code{
    font-size:2rem;
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="card">

    <div class="header">
      <i class="fas fa-network-wired"></i>
      <h1>局域网文件互传</h1>
      <div class="sub">
        WebRTC P2P · 持续连接 · 超大文件优化
      </div>
    </div>

    <div class="tabs">
      <button class="tab send active" data-tab="send">
        <i class="fas fa-upload"></i>
        发送方
      </button>

      <button class="tab recv" data-tab="recv">
        <i class="fas fa-download"></i>
        接收方
      </button>
    </div>

    <!-- SEND -->

    <div class="panel active" id="sendPanel">

      <div class="conn idle" id="sendConn">
        <span class="dot"></span>
        <span id="sendText">
          未连接
        </span>
      </div>

      <div class="room" id="roomBox">
        <div>房间号</div>
        <div class="room-code" id="roomCode">------</div>

        <button class="btn blue" onclick="copyRoom()">
          复制
        </button>
      </div>

      <div class="drop" id="drop">
        <i class="fas fa-cloud-upload-alt"></i>
        <p>点击或拖拽文件</p>
      </div>

      <input type="file" id="fileInput" multiple hidden>

      <div class="files" id="files">
        <div class="empty">
          暂无文件
        </div>
      </div>

      <div class="progress" id="sendProgress">
        <div class="bar">
          <div class="fill" id="sendFill"></div>
        </div>

        <div class="progress-info">
          <span id="sendLabel">准备中...</span>
          <span id="sendPct">0%</span>
        </div>
      </div>

      <div class="actions">

        <button class="btn green" id="createBtn">
          创建房间
        </button>

        <button class="btn blue" id="sendBtn" style="display:none;">
          发送文件
        </button>

        <button class="btn red" id="disconnectBtn" style="display:none;">
          断开
        </button>

      </div>

    </div>

    <!-- RECV -->

    <div class="panel" id="recvPanel">

      <div class="conn idle" id="recvConn">
        <span class="dot"></span>
        <span id="recvText">
          未连接
        </span>
      </div>

      <input
        class="input"
        id="roomInput"
        placeholder="000000"
        maxlength="6"
      >

      <button class="btn blue" id="joinBtn" style="width:100%;">
        加入房间
      </button>

      <div class="progress" id="recvProgress">

        <div class="bar">
          <div class="fill" id="recvFill"></div>
        </div>

        <div class="progress-info">
          <span id="recvLabel">接收中...</span>
          <span id="recvPct">0%</span>
        </div>

      </div>

      <div class="recv-list" id="recvList"></div>

    </div>

  </div>

</div>

<div class="toast" id="toast"></div>

<script>

const SIGNAL_URL = 'https://signal.xi-han.top';

const STUN = [
  'stun:stun.l.google.com:19302',
  'stun:stun1.l.google.com:19302',
  'stun:global.stun.twilio.com:3478'
];

const CHUNK_SIZE = 262144;
const MAX_BUFFER = 4 * 1024 * 1024;

const $ = id => document.getElementById(id);

function toast(msg){
  const el = $('toast');

  el.innerText = msg;
  el.classList.add('show');

  clearTimeout(el._t);

  el._t = setTimeout(()=>{
    el.classList.remove('show');
  },2500);
}

function fmt(bytes){
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
  if(bytes < 1073741824) return (bytes/1048576).toFixed(1) + ' MB';
  return (bytes/1073741824).toFixed(1) + ' GB';
}

async function api(path,opts={}){
  const r = await fetch(
    SIGNAL_URL + path,
    {
      headers:{
        'Content-Type':'application/json'
      },
      ...opts
    }
  );

  if(!r.ok){
    throw new Error(await r.text());
  }

  const t = await r.text();

  try{
    return JSON.parse(t);
  }catch{
    return t;
  }
}

document.querySelectorAll('.tab').forEach(tab=>{

  tab.onclick = ()=>{

    document.querySelectorAll('.tab')
      .forEach(v=>v.classList.remove('active'));

    document.querySelectorAll('.panel')
      .forEach(v=>v.classList.remove('active'));

    tab.classList.add('active');

    if(tab.dataset.tab === 'send'){
      $('sendPanel').classList.add('active');
    }else{
      $('recvPanel').classList.add('active');
    }

  };

});

let pendingFiles = [];

const drop = $('drop');
const fileInput = $('fileInput');

drop.onclick = ()=>fileInput.click();

drop.ondragover = e=>{
  e.preventDefault();
  drop.classList.add('drag');
};

drop.ondragleave = ()=>{
  drop.classList.remove('drag');
};

drop.ondrop = e=>{
  e.preventDefault();
  drop.classList.remove('drag');

  addFiles([...e.dataTransfer.files]);
};

fileInput.onchange = ()=>{
  addFiles([...fileInput.files]);
  fileInput.value = '';
};

function addFiles(arr){
  pendingFiles.push(...arr);
  renderFiles();
}

function renderFiles(){

  const box = $('files');

  if(!pendingFiles.length){

    box.innerHTML =
      `<div class="empty">暂无文件</div>`;

    return;
  }

  box.innerHTML = '';

  pendingFiles.forEach((f,i)=>{

    const div = document.createElement('div');

    div.className = 'file';

    div.innerHTML = `
      <i class="fas fa-file"></i>

      <div class="file-info">
        <div class="file-name">${f.name}</div>
        <div class="file-size">${fmt(f.size)}</div>
      </div>

      <button class="btn red" style="padding:6px 10px;" onclick="removeFile(${i})">
        <i class="fas fa-times"></i>
      </button>
    `;

    box.appendChild(div);

  });

}

window.removeFile = function(i){
  pendingFiles.splice(i,1);
  renderFiles();
};

let pc = null;
let dc = null;
let roomCode = '';
let connected = false;
let sending = false;

function setSend(state,text){

  const el = $('sendConn');

  el.className = 'conn ' + state;

  $('sendText').innerText = text;
}

$('createBtn').onclick = async ()=>{

  if(!pendingFiles.length){
    toast('请先选择文件');
    return;
  }

  try{

    const room = await api('/room',{
      method:'POST'
    });

    roomCode = room.code;

    $('roomCode').innerText = roomCode;
    $('roomBox').classList.add('show');

    setSend('wait','等待接收方加入');

    pc = new RTCPeerConnection({
      iceServers:[
        {
          urls:STUN
        }
      ]
    });

    dc = pc.createDataChannel(
      'file',
      {
        ordered:true
      }
    );

    dc.bufferedAmountLowThreshold =
      MAX_BUFFER / 2;

    dc.onopen = ()=>{

      connected = true;

      setSend('ok','已连接');

      $('createBtn').style.display = 'none';
      $('sendBtn').style.display = 'inline-block';
      $('disconnectBtn').style.display = 'inline-block';

      toast('连接成功');

      keepAlive();

    };

    dc.onclose = ()=>{
      resetSend();
    };

    pc.onicecandidate = async e=>{

      if(!e.candidate){

        await api(
          '/room/' + roomCode + '/offer',
          {
            method:'PUT',
            body:JSON.stringify(
              pc.localDescription
            ),
            headers:{
              'Content-Type':'text/plain'
            }
          }
        );

      }

    };

    const offer = await pc.createOffer();

    await pc.setLocalDescription(offer);

    pollAnswer();

  }catch(err){

    toast('创建失败');

    console.error(err);

  }

};

async function pollAnswer(){

  const t = setInterval(async()=>{

    try{

      const ans =
        await api(
          '/room/' + roomCode + '/answer'
        );

      if(ans && ans !== 'null'){

        clearInterval(t);

        await pc.setRemoteDescription(
          new RTCSessionDescription(ans)
        );

      }

    }catch{}

  },1500);

}

function waitBuffer(){

  return new Promise(resolve=>{

    if(dc.bufferedAmount < MAX_BUFFER){
      resolve();
    }else{
      dc.addEventListener(
        'bufferedamountlow',
        resolve,
        {once:true}
      );
    }

  });

}

$('sendBtn').onclick = async ()=>{

  if(sending) return;

  if(!connected){
    toast('未连接');
    return;
  }

  if(!pendingFiles.length){
    toast('暂无文件');
    return;
  }

  sending = true;

  $('sendProgress').classList.add('show');

  const files = [...pendingFiles];

  pendingFiles = [];

  renderFiles();

  for(let i=0;i<files.length;i++){

    const file = files[i];

    dc.send(JSON.stringify({
      type:'start',
      name:file.name,
      size:file.size,
      mime:file.type
    }));

    let offset = 0;

    while(offset < file.size){

      const chunk = await file
        .slice(offset, offset + CHUNK_SIZE)
        .arrayBuffer();

      await waitBuffer();

      dc.send(chunk);

      offset += chunk.byteLength;

      const pct =
        Math.round(
          offset / file.size * 100
        );

      $('sendFill').style.width =
        pct + '%';

      $('sendLabel').innerText =
        file.name;

      $('sendPct').innerText =
        pct + '%';

    }

  }

  dc.send(JSON.stringify({
    type:'done'
  }));

  sending = false;

  toast('发送完成');

};

$('disconnectBtn').onclick = ()=>{
  resetSend();
};

function resetSend(){

  connected = false;

  if(pc){
    pc.close();
    pc = null;
  }

  dc = null;

  setSend('idle','未连接');

  $('roomBox').classList.remove('show');

  $('createBtn').style.display = 'inline-block';
  $('sendBtn').style.display = 'none';
  $('disconnectBtn').style.display = 'none';

}

function copyRoom(){

  navigator.clipboard
    .writeText(roomCode);

  toast('已复制');

}

let recvPc = null;
let recvDc = null;
let recvFile = null;
let recvChunks = [];
let recvSize = 0;

function setRecv(state,text){

  const el = $('recvConn');

  el.className = 'conn ' + state;

  $('recvText').innerText = text;
}

$('roomInput').oninput = ()=>{

  $('roomInput').value =
    $('roomInput').value
      .replace(/\D/g,'')
      .slice(0,6);

};

$('joinBtn').onclick = async ()=>{

  const code =
    $('roomInput').value.trim();

  if(code.length !== 6){
    return;
  }

  try{

    setRecv('wait','连接中');

    const offer =
      await api(
        '/room/' + code + '/offer'
      );

    recvPc = new RTCPeerConnection({
      iceServers:[
        {
          urls:STUN
        }
      ]
    });

    recvPc.ondatachannel = e=>{

      recvDc = e.channel;

      setupReceiver();

    };

    recvPc.onicecandidate = async e=>{

      if(!e.candidate){

        await api(
          '/room/' + code + '/answer',
          {
            method:'PUT',
            body:JSON.stringify(
              recvPc.localDescription
            ),
            headers:{
              'Content-Type':'text/plain'
            }
          }
        );

      }

    };

    await recvPc.setRemoteDescription(
      new RTCSessionDescription(offer)
    );

    const ans =
      await recvPc.createAnswer();

    await recvPc.setLocalDescription(ans);

    setRecv('ok','已连接');

    toast('连接成功');

  }catch(err){

    console.error(err);

    toast('连接失败');

    setRecv('idle','未连接');

  }

};

function setupReceiver(){

  recvDc.binaryType = 'arraybuffer';

  recvDc.onmessage = async e=>{

    if(typeof e.data === 'string'){

      const msg = JSON.parse(e.data);

      if(msg.type === 'ping'){
        return;
      }

      if(msg.type === 'start'){

        recvFile = msg;

        recvChunks = [];
        recvSize = 0;

        $('recvProgress')
          .classList.add('show');

        $('recvLabel').innerText =
          msg.name;

        $('recvPct').innerText = '0%';

        $('recvFill').style.width = '0%';

      }

      if(msg.type === 'done'){

        toast('接收完成');

      }

      return;

    }

    if(!recvFile){
      return;
    }

    const chunk =
      new Uint8Array(e.data);

    recvChunks.push(chunk);

    recvSize += chunk.length;

    const pct =
      Math.round(
        recvSize / recvFile.size * 100
      );

    $('recvFill').style.width =
      pct + '%';

    $('recvPct').innerText =
      pct + '%';

    if(recvSize >= recvFile.size){

      const blob =
        new Blob(
          recvChunks,
          {
            type:recvFile.mime
          }
        );

      const url =
        URL.createObjectURL(blob);

      const item =
        document.createElement('div');

      item.className = 'recv-item';

      item.innerHTML = `
        <i class="fas fa-file"></i>

        <div class="file-info">
          <div class="file-name">
            ${recvFile.name}
          </div>

          <div class="file-size">
            ${fmt(blob.size)}
          </div>
        </div>

        <a
          href="${url}"
          download="${recvFile.name}"
        >
          保存
        </a>
      `;

      $('recvList')
        .appendChild(item);

      recvFile = null;
      recvChunks = [];
      recvSize = 0;

    }

  };

}

function keepAlive(){

  clearInterval(window.__keepAlive);

  window.__keepAlive =
    setInterval(()=>{

      if(
        dc &&
        dc.readyState === 'open'
      ){

        dc.send(JSON.stringify({
          type:'ping'
        }));

      }

    },10000);

}

window.addEventListener(
  'beforeunload',
  ()=>{

    try{
      pc?.close();
      recvPc?.close();
    }catch{}

  }
);

</script>

</body>
</html>
