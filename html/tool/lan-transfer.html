<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f1324">
  <title>局域网文件互传</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Inter", "Microsoft YaHei", "PingFang SC", sans-serif;
      background: linear-gradient(135deg, #0f1324 0%, #1a1f3a 25%, #0d0f1f 50%, #1a1f3a 75%, #0f1324 100%);
      background-attachment: fixed;
      color: #f5f5ff;
      min-height: 100vh;
      padding: 20px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 50%, rgba(184, 160, 255, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(100, 200, 255, 0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .page-wrapper {
      position: relative;
      z-index: 1;
      max-width: 880px;
      margin: 0 auto;
    }

    .hero-card {
      background: rgba(22, 28, 48, 0.92);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
      backdrop-filter: blur(14px);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .back-link {
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .back-link:hover { color: #b8a0ff; }

    .header { text-align: center; margin-bottom: 18px; }
    .header-icon { font-size: 2.5rem; color: #82dcaa; margin-bottom: 8px; display: block; }
    h1 {
      font-size: clamp(1.6rem, 3.5vw, 2.2rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #82dcaa, #64c8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }
    .subtitle { color: rgba(255,255,255,0.5); font-size: 0.9rem; }

    /* Info bar */
    .info-bar {
      background: rgba(255,200,100,0.08);
      border: 1px solid rgba(255,200,100,0.15);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: #ffc864;
    }
    .info-bar i { font-size: 1rem; flex-shrink: 0; }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0;
      background: rgba(255,255,255,0.04);
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.08);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .tab {
      flex: 1;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      color: rgba(255,255,255,0.45);
      transition: all 0.25s ease;
      border: none;
      background: transparent;
      font-family: inherit;
    }
    .tab:hover { color: rgba(255,255,255,0.7); }
    .tab.active { color: #f5f5ff; background: rgba(184,160,255,0.12); }
    .tab.send.active { background: rgba(130,220,170,0.12); color: #82dcaa; }
    .tab.recv.active { background: rgba(100,200,255,0.12); color: #64c8ff; }

    .panel { display: none; animation: fadeIn 0.3s ease; }
    .panel.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* Drop zone */
    .drop-zone {
      border: 2px dashed rgba(130,220,170,0.25);
      border-radius: 16px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      background: rgba(130,220,170,0.03);
      margin-bottom: 14px;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #82dcaa;
      background: rgba(130,220,170,0.08);
    }
    .drop-zone i { font-size: 2.8rem; color: #82dcaa; margin-bottom: 10px; display: block; }
    .drop-zone p { color: rgba(255,255,255,0.55); font-size: 0.95rem; }
    .drop-zone .hint { color: rgba(255,255,255,0.3); font-size: 0.8rem; margin-top: 4px; }

    /* File list */
    .file-list { margin-bottom: 14px; }
    .file-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      margin-bottom: 6px;
    }
    .file-item .f-icon { font-size: 1.3rem; color: #82dcaa; flex-shrink: 0; }
    .file-item .f-info { flex: 1; min-width: 0; }
    .file-item .f-name { font-size: 0.88rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-item .f-size { font-size: 0.76rem; color: rgba(255,255,255,0.4); }
    .file-item .f-remove {
      background: none; border: none; color: rgba(255,255,255,0.3);
      cursor: pointer; font-size: 1rem; padding: 4px; transition: color 0.2s;
    }
    .file-item .f-remove:hover { color: #ff6b6b; }
    .empty-files { text-align: center; padding: 10px; color: rgba(255,255,255,0.25); font-size: 0.85rem; }

    /* Signaling code area */
    .sig-section {
      margin-top: 14px;
      padding: 16px;
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      display: none;
    }
    .sig-section.show { display: block; }

    .sig-label {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.4);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sig-label i { color: #82dcaa; }
    .sig-label .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: rgba(130,220,170,0.15);
      color: #82dcaa;
      font-size: 0.75rem;
      font-weight: 700;
      margin-right: 4px;
    }

    .sig-box {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 14px;
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.5);
      word-break: break-all;
      line-height: 1.5;
      max-height: 160px;
      overflow-y: auto;
      margin-bottom: 10px;
      user-select: all;
    }
    .sig-box.code-ready {
      border-color: rgba(130,220,170,0.2);
      color: rgba(255,255,255,0.7);
    }

    .sig-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Paste area */
    .paste-area {
      margin-top: 10px;
    }
    .paste-area textarea {
      width: 100%;
      min-height: 80px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      background: rgba(0,0,0,0.25);
      color: #f5f5ff;
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 0.8rem;
      outline: none;
      resize: vertical;
      transition: border-color 0.2s;
    }
    .paste-area textarea:focus {
      border-color: #64c8ff;
      box-shadow: 0 0 0 3px rgba(100,200,255,0.1);
    }
    .paste-area textarea::placeholder { color: rgba(255,255,255,0.15); }

    /* Status box */
    .status-box {
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: 10px;
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
    }
    .status-box.show { display: flex; }
    .status-box.info { background: rgba(100,200,255,0.1); border: 1px solid rgba(100,200,255,0.2); color: #64c8ff; }
    .status-box.success { background: rgba(130,220,170,0.1); border: 1px solid rgba(130,220,170,0.2); color: #82dcaa; }
    .status-box.error { background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.2); color: #ff6b6b; }
    .status-box.warn { background: rgba(255,200,100,0.1); border: 1px solid rgba(255,200,100,0.2); color: #ffc864; }

    /* Progress */
    .progress-wrap { margin-top: 12px; display: none; }
    .progress-wrap.show { display: block; }
    .progress-bar {
      width: 100%; height: 8px;
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #82dcaa, #64c8ff);
      border-radius: 4px;
      width: 0%;
      transition: width 0.3s ease;
    }
    .progress-text {
      display: flex; justify-content: space-between;
      margin-top: 4px; font-size: 0.8rem; color: rgba(255,255,255,0.45);
    }

    /* Received files */
    .received-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: rgba(130,220,170,0.06);
      border: 1px solid rgba(130,220,170,0.15);
      border-radius: 10px;
      margin-top: 8px;
    }
    .received-item .r-icon { font-size: 1.4rem; color: #82dcaa; flex-shrink: 0; }
    .received-item .r-info { flex: 1; min-width: 0; }
    .received-item .r-name { font-size: 0.9rem; font-weight: 500; }
    .received-item .r-size { font-size: 0.78rem; color: rgba(255,255,255,0.4); }
    .received-item .r-dl {
      color: #82dcaa; text-decoration: none;
      font-size: 0.9rem; font-weight: 600; transition: color 0.2s;
    }
    .received-item .r-dl:hover { color: #b8f0d0; }

    /* Buttons */
    button { font-family: inherit; cursor: pointer; }
    .btn-primary {
      background: linear-gradient(135deg, #82dcaa, #5cc48a);
      color: white; border: none; padding: 13px 24px;
      border-radius: 12px; font-size: 0.95rem; font-weight: 600;
      transition: all 0.25s ease; display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(130,220,170,0.25); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
    .btn-primary:active { transform: translateY(0); }

    .btn-blue {
      background: linear-gradient(135deg, #64c8ff, #3498db);
      color: white; border: none; padding: 13px 24px;
      border-radius: 12px; font-size: 0.95rem; font-weight: 600;
      transition: all 0.25s ease; display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-blue:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(100,200,255,0.25); }
    .btn-blue:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

    .btn-copy {
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-copy:hover { background: rgba(255,255,255,0.12); }

    .btn-secondary {
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.55);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); }

    .btn-full { width: 100%; justify-content: center; }
    .btn-connect {
      background: rgba(130,220,170,0.1);
      color: #82dcaa;
      border: 1px solid rgba(130,220,170,0.2);
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-connect:hover { background: rgba(130,220,170,0.2); }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(22,28,48,0.96);
      border: 1px solid rgba(130,220,170,0.3);
      color: #82dcaa;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 999;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { border-color: rgba(255,107,107,0.3); color: #ff6b6b; }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top: 2px solid currentColor;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Step guide */
    .steps {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .step {
      flex: 1;
      min-width: 120px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      text-align: center;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.35);
      transition: all 0.3s ease;
    }
    .step .step-icon {
      display: block;
      font-size: 1.3rem;
      margin-bottom: 4px;
    }
    .step.active {
      border-color: rgba(130,220,170,0.3);
      color: #82dcaa;
      background: rgba(130,220,170,0.06);
    }
    .step.done {
      border-color: rgba(130,220,170,0.15);
      color: rgba(130,220,170,0.6);
    }
    .step.recv-active {
      border-color: rgba(100,200,255,0.3);
      color: #64c8ff;
      background: rgba(100,200,255,0.06);
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-title i { color: #82dcaa; }

    @media (max-width: 768px) {
      body { padding: 12px; }
      .hero-card { padding: 16px; border-radius: 18px; }
      .step { min-width: 80px; padding: 8px; font-size: 0.72rem; }
      .sig-box { font-size: 0.65rem; max-height: 120px; }
    }
    @media (min-width: 768px) {
      body { padding: 6vh 24px; }
      .hero-card { padding: 36px; border-radius: 32px; }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div class="hero-card">
      <div class="top-bar">
        <div></div>
        <a href="../tools.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回工具</a>
      </div>

      <div class="header">
        <i class="fas fa-network-wired header-icon"></i>
        <h1>局域网文件互传</h1>
        <p class="subtitle">P2P 直连 · 纯浏览器传输 · 无需服务器</p>
      </div>

      <div class="info-bar">
        <i class="fas fa-info-circle"></i>
        <span>通过互传"连接码"建立 P2P 通道。两部设备需在同一局域网下（同一 WiFi）。不需要任何服务器。</span>
      </div>

      <div class="tabs">
        <button class="tab send active" data-tab="send"><i class="fas fa-upload"></i> 发送文件</button>
        <button class="tab recv" data-tab="recv"><i class="fas fa-download"></i> 接收文件</button>
      </div>

      <!-- ===== SEND PANEL ===== -->
      <div class="panel active" id="panelSend">
        <div class="steps" id="sendSteps">
          <div class="step active" id="sStep1"><span class="step-icon">①</span>选择文件</div>
          <div class="step" id="sStep2"><span class="step-icon">②</span>生成连接码</div>
          <div class="step" id="sStep3"><span class="step-icon">③</span>等待应答</div>
          <div class="step" id="sStep4"><span class="step-icon">④</span>传输中</div>
        </div>

        <div class="drop-zone" id="dropZone">
          <i class="fas fa-cloud-upload-alt"></i>
          <p>拖拽文件到此处，或点击选择</p>
          <div class="hint">支持任意格式，大文件建议局域网传输</div>
        </div>
        <input type="file" id="fileInput" multiple hidden>

        <div class="file-list" id="fileList"><div class="empty-files">暂无选择文件</div></div>

        <!-- Step 2: Send Offer -->
        <div class="sig-section" id="sigOffer">
          <div class="sig-label"><span class="step-num">②</span>将以下连接码 <strong style="color:#82dcaa;">复制</strong> 发给接收方</div>
          <div class="sig-box" id="offerBox"></div>
          <div class="sig-actions">
            <button class="btn-copy" onclick="copySig('offerBox')"><i class="fas fa-copy"></i> 复制连接码</button>
            <button class="btn-secondary" onclick="resetSender()"><i class="fas fa-redo"></i> 重新生成</button>
          </div>
        </div>

        <!-- Step 3: Paste Answer -->
        <div class="sig-section" id="sigAnswer">
          <div class="sig-label"><span class="step-num">③</span>将接收方回复的应答码 <strong style="color:#64c8ff;">粘贴</strong> 到下方</div>
          <div class="paste-area">
            <textarea id="answerInput" placeholder="粘贴接收方回复的应答码..." rows="3"></textarea>
          </div>
          <button class="btn-connect btn-full" id="connectBtn" disabled><i class="fas fa-link"></i> 建立连接</button>
        </div>

        <div class="status-box" id="sendStatus"></div>
        <div class="progress-wrap" id="sendProgress">
          <div class="progress-bar"><div class="progress-fill" id="sendProgressFill"></div></div>
          <div class="progress-text">
            <span id="sendProgressLabel">准备中...</span>
            <span id="sendProgressPct">0%</span>
          </div>
        </div>
      </div>

      <!-- ===== RECEIVE PANEL ===== -->
      <div class="panel" id="panelRecv">
        <div class="steps" id="recvSteps">
          <div class="step recv-active" id="rStep1"><span class="step-icon">①</span>粘贴连接码</div>
          <div class="step" id="rStep2"><span class="step-icon">②</span>生成应答码</div>
          <div class="step" id="rStep3"><span class="step-icon">③</span>传输中</div>
        </div>

        <!-- Step 1: Paste Offer -->
        <div class="section-title"><i class="fas fa-paste"></i> 粘贴发送方给的连接码</div>
        <div class="paste-area">
          <textarea id="offerInput" placeholder="粘贴发送方复制的连接码..." rows="4"></textarea>
        </div>
        <button class="btn-blue btn-full" id="acceptOfferBtn" disabled><i class="fas fa-check"></i> 接受连接</button>

        <!-- Step 2: Show Answer -->
        <div class="sig-section" id="sigRecvAnswer">
          <div class="sig-label"><span class="step-num">②</span>将以下应答码 <strong style="color:#64c8ff;">复制</strong> 发回给发送方</div>
          <div class="sig-box" id="answerBox"></div>
          <div class="sig-actions">
            <button class="btn-copy" onclick="copySig('answerBox')"><i class="fas fa-copy"></i> 复制应答码</button>
          </div>
          <div class="status-box info show" style="margin-top:10px;">
            <i class="fas fa-hourglass-half"></i>
            <span>等待发送方建立连接...</span>
          </div>
        </div>

        <div class="status-box" id="recvStatus"></div>
        <div class="progress-wrap" id="recvProgress">
          <div class="progress-bar"><div class="progress-fill" id="recvProgressFill"></div></div>
          <div class="progress-text">
            <span id="recvProgressLabel">接收中...</span>
            <span id="recvProgressPct">0%</span>
          </div>
        </div>
        <div id="recvFiles"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg"></span></div>

  <script>
    // ===== CONST =====
    const STUN = [
      'stun:stun.l.google.com:19302',
      'stun:stun1.l.google.com:19302',
      'stun:stun2.l.google.com:19302'
    ];

    // ===== DOM =====
    const $ = id => document.getElementById(id);
    const toast = $('toast');
    const toastMsg = $('toastMsg');

    function showToast(msg, err = false) {
      toastMsg.textContent = msg;
      toast.className = 'toast' + (err ? ' error' : '');
      toast.querySelector('i').className = 'fas ' + (err ? 'fa-exclamation-circle' : 'fa-check-circle');
      toast.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function fmtSize(b) {
      if (b < 1024) return b + ' B';
      if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
      return (b / 1048576).toFixed(1) + ' MB';
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // ===== TABS =====
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        $('panel' + tab.dataset.tab.charAt(0).toUpperCase() + tab.dataset.tab.slice(1)).classList.add('active');
      });
    });

    // ===== FILE SELECTION =====
    const dropZone = $('dropZone');
    const fileInput = $('fileInput');
    let selectedFiles = [];

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); addFiles(Array.from(e.dataTransfer.files)); });
    fileInput.addEventListener('change', () => { addFiles(Array.from(fileInput.files)); fileInput.value = ''; });

    function addFiles(files) {
      selectedFiles = selectedFiles.concat(files);
      renderFiles();
    }

    function removeFile(i) {
      selectedFiles.splice(i, 1);
      renderFiles();
    }

    function renderFiles() {
      const el = $('fileList');
      if (selectedFiles.length === 0) {
        el.innerHTML = '<div class="empty-files">暂无选择文件</div>';
        return;
      }
      el.innerHTML = selectedFiles.map((f, i) => {
        const icon = f.type.startsWith('image/') ? 'fa-file-image' :
                     f.type.startsWith('video/') ? 'fa-file-video' :
                     f.type.startsWith('audio/') ? 'fa-file-audio' :
                     f.type.includes('pdf') ? 'fa-file-pdf' :
                     (f.type.includes('zip') || f.type.includes('rar') || f.type.includes('tar')) ? 'fa-file-archive' :
                     'fa-file';
        return '<div class="file-item">' +
          '<i class="fas ' + icon + ' f-icon"></i>' +
          '<div class="f-info"><div class="f-name">' + esc(f.name) + '</div><div class="f-size">' + fmtSize(f.size) + '</div></div>' +
          '<button class="f-remove" onclick="removeFile(' + i + ')"><i class="fas fa-times"></i></button></div>';
      }).join('');
    }

    // ===== SIGNALING HELPERS =====
    function encodeSDP(sdp) {
      // Compress SDP: remove whitespace, base64
      const json = JSON.stringify(sdp);
      return btoa(unescape(encodeURIComponent(json)));
    }

    function decodeSDP(str) {
      const json = decodeURIComponent(escape(atob(str)));
      return JSON.parse(json);
    }

    function copySig(boxId) {
      const box = $(boxId);
      const text = box.textContent;
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        showToast('已复制到剪贴板');
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('已复制到剪贴板');
      });
    }

    function step(el, state) {
      el.className = 'step ' + state;
    }

    // ===== SENDER =====
    let senderPc = null;
    let senderDc = null;
    let sending = false;

    // Listen for paste in answer input
    $('answerInput').addEventListener('input', () => {
      $('connectBtn').disabled = !$('answerInput').value.trim();
    });

    // "创建连接并生成连接码" happens when files are selected and user completes file selection
    // We auto-create the offer when files are selected and we need to start

    // Actually, let me re-think the flow. The user selects files, then we auto-generate the offer.
    // Let me add the auto-generation or a manual trigger.

    // Auto-generate offer when files change
    let offerGenerated = false;

    function watchFilesForOffer() {
      // This triggers when user has files and clicks somewhere
      // Actually, let me make an explicit button "生成连接码"
    }

    // I'll add a button below the file list. Let me modify renderFiles to include or add a separate div.

    // Let me set up the auto-offer generation. When files are selected, we show a "生成连接码" button.
    // I need to add a container for this button. Let me use a simpler approach:
    // Overwrite the drop zone or use a separate action area.

    // ===== SENDER: Generate Offer =====
    async function generateOffer() {
      if (selectedFiles.length === 0) { showToast('请先选择文件', true); return; }

      step($('sStep1'), 'done');
      step($('sStep2'), 'active');

      try {
        senderPc = new RTCPeerConnection({ iceServers: [{ urls: STUN }] });

        senderDc = senderPc.createDataChannel('fileTransfer', { ordered: true });

        senderDc.onopen = () => {
          step($('sStep3'), 'done');
          step($('sStep4'), 'active');
          status($('sendStatus'), '连接已建立，开始发送文件...', 'success');
          sendAllFiles();
        };

        senderDc.onclose = () => {
          if (!sending) return;
          status($('sendStatus'), '传输已断开', 'warn');
        };

        senderPc.oniceconnectionstatechange = () => {
          if (senderPc.iceConnectionState === 'connected' || senderPc.iceConnectionState === 'completed') {
            // Connected - file transfer will start via dc.onopen
          }
          if (senderPc.iceConnectionState === 'disconnected' || senderPc.iceConnectionState === 'failed') {
            status($('sendStatus'), '连接断开', 'error');
          }
        };

        senderPc.onicecandidate = (e) => {
          if (!e.candidate) {
            // All candidates gathered - SDP is ready
            const encoded = encodeSDP(senderPc.localDescription);
            $('offerBox').textContent = encoded;
            $('offerBox').classList.add('code-ready');
            $('sigOffer').classList.add('show');
            $('sigAnswer').classList.add('show');
            step($('sStep2'), 'done');
            step($('sStep3'), 'active');
            showToast('连接码已生成，复制后发给接收方');
          }
        };

        const offer = await senderPc.createOffer({ iceRestart: false });
        await senderPc.setLocalDescription(offer);

        // The onicecandidate handler above will display the offer when gathering completes.
        // But if candidates gather instantly, we need a fallback.
        // setTimeout to check if offer was displayed
        setTimeout(() => {
          if (!$('offerBox').textContent && senderPc.localDescription) {
            const encoded = encodeSDP(senderPc.localDescription);
            $('offerBox').textContent = encoded;
            $('offerBox').classList.add('code-ready');
            $('sigOffer').classList.add('show');
            $('sigAnswer').classList.add('show');
            step($('sStep2'), 'done');
            step($('sStep3'), 'active');
          }
        }, 1000);

      } catch (e) {
        status($('sendStatus'), '生成连接码失败: ' + e.message, 'error');
        console.error(e);
      }
    }

    // ===== SENDER: Connect with Answer =====
    $('connectBtn').addEventListener('click', async () => {
      const raw = $('answerInput').value.trim();
      if (!raw) { showToast('请粘贴应答码', true); return; }

      try {
        const answer = decodeSDP(raw);
        await senderPc.setRemoteDescription(new RTCSessionDescription(answer));
        status($('sendStatus'), '连接建立中...', 'info');
        $('connectBtn').disabled = true;
        $('connectBtn').innerHTML = '<span class="spinner"></span> 连接中...';
        step($('sStep3'), 'done');
      } catch (e) {
        status($('sendStatus'), '应答码无效: ' + e.message, 'error');
        showToast('应答码解析失败', true);
      }
    });

    // ===== SENDER: Send Files =====
    async function sendAllFiles() {
      sending = true;
      const pr = $('sendProgress');
      const pf = $('sendProgressFill');
      const pl = $('sendProgressLabel');
      const pp = $('sendProgressPct');
      pr.classList.add('show');

      // Send file count
      senderDc.send(JSON.stringify({ type: 'meta', count: selectedFiles.length }));

      for (let i = 0; i < selectedFiles.length; i++) {
        const file = selectedFiles[i];

        senderDc.send(JSON.stringify({
          type: 'file-start',
          name: file.name,
          size: file.size,
          mime: file.type || 'application/octet-stream',
          index: i,
          total: selectedFiles.length
        }));

        const CHUNK = 16384;
        let offset = 0;

        while (offset < file.size) {
          const chunk = file.slice(offset, Math.min(offset + CHUNK, file.size));
          const buf = await chunk.arrayBuffer();
          senderDc.send(buf);
          offset += CHUNK;

          const pct = Math.round((offset / file.size) * 100);
          pf.style.width = pct + '%';
          pl.textContent = '发送: ' + file.name + ' (' + (i + 1) + '/' + selectedFiles.length + ')';
          pp.textContent = pct + '%';
        }
      }

      senderDc.send(JSON.stringify({ type: 'done' }));
      pf.style.width = '100%';
      pl.textContent = '✅ 全部发送完成！';
      pp.textContent = '100%';
      step($('sStep4'), 'done');
      status($('sendStatus'), '所有文件发送成功！', 'success');
      showToast('所有文件已发送');

      setTimeout(resetSender, 5000);
    }

    function resetSender() {
      if (senderPc) { try { senderPc.close(); } catch(e) {} senderPc = null; }
      senderDc = null;
      sending = false;
      $('sigOffer').classList.remove('show');
      $('sigAnswer').classList.remove('show');
      $('offerBox').textContent = '';
      $('answerInput').value = '';
      $('connectBtn').disabled = true;
      $('connectBtn').innerHTML = '<i class="fas fa-link"></i> 建立连接';
      $('sendStatus').className = 'status-box';
      $('sendProgress').classList.remove('show');
      $('sendProgressFill').style.width = '0%';
      step($('sStep1'), 'active');
      step($('sStep2'), '');
      step($('sStep3'), '');
      step($('sStep4'), '');
    }

    // ===== Add "generate offer" trigger after file selection =====
    // I'll add a hidden button/div that appears when files are selected
    // Let me modify renderFiles to include a generate button

    // Override renderFiles to add the generate button
    const _origRender = renderFiles;
    renderFiles = function() {
      _origRender();
      const el = $('fileList');
      if (selectedFiles.length > 0) {
        // Add generate button
        const btn = document.createElement('div');
        btn.style.marginTop = '10px';
        btn.style.textAlign = 'center';
        btn.innerHTML = '<button class="btn-primary btn-full" id="genOfferBtn"><i class="fas fa-link"></i> 生成连接码</button>';
        el.appendChild(btn);
        $('genOfferBtn').addEventListener('click', generateOffer);
      }
      // Reset offer state when files change
      resetSender();
    };

    // ===== RECEIVER =====
    let receiverPc = null;
    let receiverDc = null;
    let currentFile = null;
    let currentFileBuf = [];
    let fileCount = 0;
    let filesDone = 0;

    $('offerInput').addEventListener('input', () => {
      $('acceptOfferBtn').disabled = !$('offerInput').value.trim();
    });

    $('acceptOfferBtn').addEventListener('click', acceptOffer);

    async function acceptOffer() {
      const raw = $('offerInput').value.trim();
      if (!raw) { showToast('请粘贴发送方的连接码', true); return; }

      step($('rStep1'), 'done');
      step($('rStep2'), 'active');

      try {
        const offer = decodeSDP(raw);

        receiverPc = new RTCPeerConnection({ iceServers: [{ urls: STUN }] });

        receiverPc.ondatachannel = (event) => {
          receiverDc = event.channel;
          setupReceiveChannel(receiverDc);
        };

        receiverPc.oniceconnectionstatechange = () => {
          if (receiverPc.iceConnectionState === 'connected' || receiverPc.iceConnectionState === 'completed') {
            step($('rStep2'), 'done');
            step($('rStep3'), 'active');
          }
          if (receiverPc.iceConnectionState === 'disconnected' || receiverPc.iceConnectionState === 'failed') {
            status($('recvStatus'), '连接断开', 'error');
          }
        };

        receiverPc.onicecandidate = async (e) => {
          if (!e.candidate) {
            // All candidates gathered - show answer
            const encoded = encodeSDP(receiverPc.localDescription);
            $('answerBox').textContent = encoded;
            $('answerBox').classList.add('code-ready');
            $('sigRecvAnswer').classList.add('show');
            showToast('应答码已生成，复制后发回给发送方');
          }
        };

        await receiverPc.setRemoteDescription(new RTCSessionDescription(offer));
        const answer = await receiverPc.createAnswer();
        await receiverPc.setLocalDescription(answer);

        // Fallback if candidates gather instantly
        setTimeout(() => {
          if (!$('answerBox').textContent && receiverPc.localDescription) {
            const encoded = encodeSDP(receiverPc.localDescription);
            $('answerBox').textContent = encoded;
            $('answerBox').classList.add('code-ready');
            $('sigRecvAnswer').classList.add('show');
          }
        }, 1000);

        $('acceptOfferBtn').disabled = true;
        $('acceptOfferBtn').innerHTML = '<span class="spinner"></span> 等待连接...';

      } catch (e) {
        status($('recvStatus'), '连接码无效: ' + e.message, 'error');
        showToast('连接码解析失败', true);
        console.error(e);
      }
    }

    function setupReceiveChannel(dc) {
      const st = $('recvStatus');
      const pr = $('recvProgress');
      const pf = $('recvProgressFill');
      const pl = $('recvProgressLabel');
      const pp = $('recvProgressPct');
      const rf = $('recvFiles');

      dc.binaryType = 'arraybuffer';

      dc.onmessage = (event) => {
        if (typeof event.data === 'string') {
          try {
            const msg = JSON.parse(event.data);

            if (msg.type === 'meta') {
              fileCount = msg.count;
              status(st, '准备接收 ' + fileCount + ' 个文件...', 'success');
            } else if (msg.type === 'file-start') {
              currentFile = msg;
              currentFileBuf = [];
              pr.classList.add('show');
              pl.textContent = '接收: ' + msg.name;
              pp.textContent = '0%';
              pf.style.width = '0%';
            } else if (msg.type === 'done') {
              pf.style.width = '100%';
              pl.textContent = '✅ 全部接收完成！';
              pp.textContent = '100%';
              status(st, '所有文件接收完成！', 'success');
              showToast('文件接收完成！');
            }
          } catch(e) {}
        } else {
          // Binary chunk
          if (currentFile) {
            const bytes = new Uint8Array(event.data);
            currentFileBuf.push(bytes);

            const received = currentFileBuf.reduce((a, b) => a + b.length, 0);
            const pct = Math.round((received / currentFile.size) * 100);
            pf.style.width = pct + '%';
            pp.textContent = pct + '%';

            if (received >= currentFile.size) {
              // File complete
              const allBytes = new Uint8Array(received);
              let pos = 0;
              for (const b of currentFileBuf) { allBytes.set(b, pos); pos += b.length; }

              const blob = new Blob([allBytes], { type: currentFile.mime });
              const url = URL.createObjectURL(blob);

              filesDone++;
              const icon = currentFile.mime.startsWith('image/') ? 'fa-file-image' :
                           currentFile.mime.startsWith('video/') ? 'fa-file-video' :
                           'fa-file';

              if (filesDone === 1) {
                rf.innerHTML = '<div style="margin-top:14px;font-size:0.85rem;color:rgba(255,255,255,0.4);margin-bottom:4px;">📥 已接收文件:</div>';
              }
              rf.innerHTML += '<div class="received-item">' +
                '<i class="fas ' + icon + ' r-icon"></i>' +
                '<div class="r-info"><div class="r-name">' + esc(currentFile.name) + '</div><div class="r-size">' + fmtSize(blob.size) + '</div></div>' +
                '<a href="' + url + '" download="' + esc(currentFile.name) + '" class="r-dl"><i class="fas fa-download"></i> 保存</a></div>';

              currentFile = null;
              currentFileBuf = [];
            }
          }
        }
      };

      dc.onclose = () => {};
    }

    // ===== Utility =====
    function status(el, msg, type = 'info') {
      el.className = 'status-box ' + type + ' show';
      const icons = { info: 'fa-info-circle', success: 'fa-check-circle', error: 'fa-times-circle', warn: 'fa-exclamation-triangle' };
      el.innerHTML = '<i class="fas ' + (icons[type] || 'fa-info-circle') + '"></i> <span>' + msg + '</span>';
    }

    // ===== Cleanup =====
    window.addEventListener('beforeunload', () => {
      if (senderPc) try { senderPc.close(); } catch(e) {}
      if (receiverPc) try { receiverPc.close(); } catch(e) {}
    });
  </script>
