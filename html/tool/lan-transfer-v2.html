<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>局域网极速互传 · LanTransfer V2</title>
<link rel="stylesheet" href="../../assets/css/font-awesome-6.0.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Inter","Microsoft YaHei","PingFang SC",sans-serif;
  background:linear-gradient(135deg,#0f1324 0%,#1a1f3a 25%,#0d0f1f 50%,#1a1f3a 75%,#0f1324 100%);
  background-attachment:fixed;color:#f5f5ff;min-height:100vh;padding:20px;
}
body::before{
  content:'';position:fixed;inset:0;
  background:radial-gradient(circle at 20% 50%,rgba(184,160,255,.08) 0%,transparent 50%),
             radial-gradient(circle at 80% 80%,rgba(100,200,255,.06) 0%,transparent 50%);
  pointer-events:none;z-index:0;
}
.page-wrapper{position:relative;z-index:1;max-width:780px;margin:0 auto;}
.hero-card{
  background:rgba(22,28,48,.92);border:1px solid rgba(255,255,255,.08);
  border-radius:24px;padding:32px;
  box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);
  backdrop-filter:blur(14px);
}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
.back-link{color:rgba(255,255,255,.6);text-decoration:none;font-size:.95rem;transition:color .2s;display:inline-flex;align-items:center;gap:6px;}
.back-link:hover{color:#b8a0ff;}
h1{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:800;letter-spacing:-.04em;
  background:linear-gradient(135deg,#b8a0ff,#64c8ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.subtitle{color:rgba(255,255,255,.55);font-size:.95rem;margin-top:4px;}

/* Mode Toggle */
.mode-switch{display:flex;gap:8px;margin-bottom:28px;}
.mode-btn{
  flex:1;padding:14px 20px;border-radius:14px;border:1.5px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.04);color:rgba(255,255,255,.6);
  font-size:1rem;font-weight:600;cursor:pointer;transition:all .25s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.mode-btn:hover{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.08);}
.mode-btn.active{
  border-color:#b8a0ff;background:rgba(184,160,255,.12);
  color:#f5f5ff;box-shadow:0 0 20px rgba(184,160,255,.15);
}

/* Panels */
.panel{display:none;}
.panel.visible{display:block;}

/* Drop Zone */
.drop-zone{
  border:2px dashed rgba(255,255,255,.15);border-radius:18px;
  padding:48px 24px;text-align:center;cursor:pointer;transition:all .25s;
  background:rgba(255,255,255,.02);margin-bottom:20px;
}
.drop-zone:hover{border-color:rgba(184,160,255,.4);background:rgba(184,160,255,.05);}
.drop-zone.drag-over{border-color:#b8a0ff;background:rgba(184,160,255,.1);}
.drop-zone i{font-size:2.4rem;color:rgba(255,255,255,.35);margin-bottom:10px;display:block;}
.drop-zone .hint{color:rgba(255,255,255,.5);font-size:.95rem;}
.drop-zone .hint strong{color:#b8a0ff;}

/* File List */
.file-list{margin-bottom:20px;display:flex;flex-direction:column;gap:8px;}
.file-item{
  display:flex;align-items:center;gap:12px;padding:12px 16px;
  background:rgba(255,255,255,.04);border-radius:12px;border:1px solid rgba(255,255,255,.06);
}
.file-item .fi-icon{font-size:1.3rem;color:#64c8ff;flex-shrink:0;}
.file-item .fi-info{flex:1;min-width:0;}
.file-item .fi-name{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.file-item .fi-size{color:rgba(255,255,255,.45);font-size:.8rem;margin-top:2px;}
.file-item .fi-remove{color:rgba(255,255,255,.35);cursor:pointer;padding:4px;transition:color .2s;}
.file-item .fi-remove:hover{color:#ff6b6b;}

/* Room Code */
.room-section{text-align:center;margin:24px 0;}
.room-code{
  font-size:3rem;font-weight:900;letter-spacing:.15em;
  background:linear-gradient(135deg,#b8a0ff,#64c8ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  font-variant-numeric:tabular-nums;
}
.room-label{color:rgba(255,255,255,.45);font-size:.85rem;margin-bottom:6px;}

/* QR Code */
.qr-wrapper{display:flex;justify-content:center;margin:20px 0;}
#qrcode canvas{border-radius:14px;background:#fff;padding:6px;}
.qr-hint{text-align:center;color:rgba(255,255,255,.45);font-size:.85rem;margin-top:8px;}

/* Input */
.input-group{display:flex;gap:10px;margin-bottom:20px;}
.room-input{
  flex:1;padding:14px 18px;border-radius:14px;
  border:1.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);
  color:#f5f5ff;font-size:1.3rem;font-weight:700;letter-spacing:.12em;text-align:center;
  outline:none;transition:border-color .25s;font-variant-numeric:tabular-nums;
}
.room-input:focus{border-color:#b8a0ff;}
.room-input::placeholder{color:rgba(255,255,255,.25);font-weight:400;}

/* Buttons */
.btn{
  padding:12px 28px;border-radius:14px;border:none;font-size:1rem;font-weight:700;
  cursor:pointer;transition:all .25s;display:inline-flex;align-items:center;gap:8px;
}
.btn-primary{
  background:linear-gradient(135deg,#b8a0ff,#7c6ff7);color:#fff;
  box-shadow:0 4px 20px rgba(184,160,255,.3);
}
.btn-primary:hover{box-shadow:0 6px 28px rgba(184,160,255,.45);transform:translateY(-1px);}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-secondary{
  background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);
  border:1px solid rgba(255,255,255,.1);
}
.btn-secondary:hover{background:rgba(255,255,255,.14);}
.btn-block{width:100%;justify-content:center;}

/* Progress */
.progress-section{margin:24px 0;display:none;}
.progress-section.visible{display:block;}
.progress-bar-wrap{
  height:8px;background:rgba(255,255,255,.08);border-radius:8px;overflow:hidden;margin-bottom:12px;
}
.progress-bar{
  height:100%;border-radius:8px;
  background:linear-gradient(90deg,#b8a0ff,#64c8ff);
  transition:width .3s;width:0%;
}
.progress-stats{display:flex;justify-content:space-between;color:rgba(255,255,255,.55);font-size:.85rem;flex-wrap:wrap;gap:8px;}
.speed-graph{height:60px;margin-top:12px;position:relative;}
.speed-graph canvas{width:100%;height:100%;border-radius:8px;background:rgba(0,0,0,.2);}

/* Status */
.status-msg{text-align:center;color:rgba(255,255,255,.5);font-size:.9rem;margin:12px 0;min-height:24px;}
.status-msg.connected{color:#64c8ff;}
.status-msg.error{color:#ff6b6b;}

/* Toast */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:rgba(22,28,48,.95);border:1px solid rgba(255,255,255,.12);
  border-radius:12px;padding:12px 24px;color:#f5f5ff;font-size:.9rem;
  z-index:100;box-shadow:0 8px 32px rgba(0,0,0,.5);opacity:0;transition:opacity .3s;
  pointer-events:none;
}
.toast.show{opacity:1;}

/* Responsive */
@media(min-width:768px){
  .hero-card{border-radius:32px;padding:36px 40px;}
}
@media(max-width:600px){
  body{padding:12px;}
  .hero-card{padding:20px;border-radius:18px;}
  .room-code{font-size:2.2rem;}
  .mode-btn{padding:12px 14px;font-size:.9rem;}
}
</style>
</head>
<body>
<div class="page-wrapper">
  <div class="hero-card">
    <!-- Top Bar -->
    <div class="top-bar">
      <a href="../tools.html" class="back-link"><i class="fa fa-arrow-left"></i> 工具导航</a>
    </div>
    <h1><i class="fa fa-bolt"></i> 局域网极速互传</h1>
    <p class="subtitle">P2P 直连传输 · 不限文件大小 · 跑满路由器带宽</p>

    <!-- Mode Toggle -->
    <div class="mode-switch">
      <button class="mode-btn active" data-mode="send" id="btnSendMode">
        <i class="fa fa-paper-plane"></i> 发送文件
      </button>
      <button class="mode-btn" data-mode="receive" id="btnRecvMode">
        <i class="fa fa-download"></i> 接收文件
      </button>
    </div>

    <!-- === SEND PANEL === -->
    <div class="panel visible" id="panelSend">
      <div class="drop-zone" id="dropZone">
        <i class="fa fa-cloud-upload"></i>
        <div class="hint">拖拽文件到此处 或 <strong>点击选择文件</strong></div>
        <input type="file" id="fileInput" multiple hidden>
      </div>
      <div class="file-list" id="fileList"></div>
      <button class="btn btn-primary btn-block" id="btnCreateRoom" disabled>
        <i class="fa fa-qrcode"></i> 创建房间 & 生成二维码
      </button>

      <!-- Room Info (shown after creation) -->
      <div id="roomInfo" style="display:none;">
        <div class="room-section">
          <div class="room-label">房间号</div>
          <div class="room-code" id="roomCode">------</div>
        </div>
        <div class="qr-wrapper"><div id="qrcode"></div></div>
        <div class="qr-hint">让对方扫描二维码 或 输入房间号加入</div>
      </div>
    </div>

    <!-- === RECEIVE PANEL === -->
    <div class="panel" id="panelRecv">
      <div class="input-group">
        <input type="text" class="room-input" id="roomInput" placeholder="输入6位房间号" maxlength="6" inputmode="numeric">
        <button class="btn btn-primary" id="btnJoinRoom">
          <i class="fa fa-sign-in"></i> 加入
        </button>
      </div>
      <div style="text-align:center;color:rgba(255,255,255,.35);margin-bottom:16px;">— 或 —</div>
      <button class="btn btn-secondary btn-block" id="btnScanQR" style="display:none;">
        <i class="fa fa-camera"></i> 扫描二维码 (移动端)
      </button>
    </div>

    <!-- Shared: Status + Progress -->
    <div class="status-msg" id="statusMsg">选择文件开始传输</div>
    <div class="progress-section" id="progressSection">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span style="font-weight:700;" id="progressPercent">0%</span>
        <span style="color:rgba(255,255,255,.45);font-size:.85rem;" id="progressFile">-</span>
      </div>
      <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
      <div class="progress-stats">
        <span>已传输: <strong id="statSent">0 B</strong></span>
        <span>速度: <strong id="statSpeed">0 MB/s</strong></span>
        <span>剩余: <strong id="statETA">--</strong></span>
      </div>
      <div class="speed-graph"><canvas id="speedCanvas"></canvas></div>
    </div>
    <div id="toast" class="toast"></div>
  </div>
</div>

<script src="../../assets/js/qrcode.min.js"></script>
<script>
// ============================================================
// LanTransfer V2 — Streams-based P2P file transfer
// ============================================================
(function(){
'use strict';

const SIGNAL_URL = 'https://xfer.xi-han.top';
const CHUNK_SIZE = 256 * 1024;
const MAX_BUFFER = 32 * 1024 * 1024;         // 32MB — flow control kicks in above this
// LAN-only: no STUN needed. Host candidates (192.168.x.x) are sufficient.
// Adding Google STUN in China blocks ICE gathering for 10-30s.
const ICE_SERVERS = [];

// ===== DOM REFS =====
const $ = id => document.getElementById(id);
const dropZone = $('dropZone'), fileInput = $('fileInput'), fileList = $('fileList');
const btnCreateRoom = $('btnCreateRoom'), btnJoinRoom = $('btnJoinRoom');
const roomInfo = $('roomInfo'), roomCode = $('roomCode');
const roomInput = $('roomInput'), statusMsg = $('statusMsg');
const progressSection = $('progressSection'), progressBar = $('progressBar');
const progressPercent = $('progressPercent'), progressFile = $('progressFile');
const statSent = $('statSent'), statSpeed = $('statSpeed'), statETA = $('statETA');
const speedCanvas = $('speedCanvas'), toastEl = $('toast');
const panelSend = $('panelSend'), panelRecv = $('panelRecv');
const btnSendMode = $('btnSendMode'), btnRecvMode = $('btnRecvMode');

// ===== STATE =====
let files = [], currentMode = 'send';
let pc = null, dc = null, roomCodeVal = null;
let transferTimer = null, speedHistory = [];

// ===== HELPERS =====
function fmtSize(bytes) {
  if (bytes === 0) return '0 B';
  const u = ['B','KB','MB','GB','TB'];
  const i = Math.floor(Math.log(bytes) / Math.log(1024));
  return (bytes / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0) + ' ' + u[i];
}

function fmtTime(seconds) {
  if (!isFinite(seconds) || seconds < 0) return '--';
  if (seconds < 60) return Math.ceil(seconds) + 's';
  return Math.floor(seconds / 60) + 'm ' + Math.ceil(seconds % 60) + 's';
}

function showToast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastEl._t); toastEl._t = setTimeout(() => toastEl.classList.remove('show'), 2500);
}

function setStatus(msg, cls) {
  statusMsg.textContent = msg; statusMsg.className = 'status-msg ' + (cls||'');
}

// ===== MODE SWITCHING =====
function switchMode(mode) {
  currentMode = mode;
  btnSendMode.classList.toggle('active', mode === 'send');
  btnRecvMode.classList.toggle('active', mode === 'receive');
  panelSend.classList.toggle('visible', mode === 'send');
  panelRecv.classList.toggle('visible', mode === 'receive');
  if (mode === 'send') {
    setStatus(files.length ? `已选择 ${files.length} 个文件` : '选择文件开始传输');
  } else {
    setStatus('输入房间号加入传输');
  }
}

btnSendMode.onclick = () => switchMode('send');
btnRecvMode.onclick = () => switchMode('receive');

// ===== WORKER API =====
async function apiCall(path, opts = {}) {
  const res = await fetch(SIGNAL_URL + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  const text = await res.text();
  try { return JSON.parse(text); } catch(e) { return text; }
}

async function createRoom() {
  const data = await apiCall('/room', { method: 'POST' });
  return data.code;
}

async function putOffer(code, sdp) {
  await apiCall(`/room/${code}/offer`, { method: 'PUT', body: JSON.stringify(sdp) });
}

async function getOffer(code) {
  // Poll for offer (immediate read, frontend retry)
  for (let i = 0; i < 30; i++) {
    const data = await apiCall(`/room/${code}/offer`);
    if (data && data !== 'null') {
      try { return typeof data === 'string' ? JSON.parse(data) : data; } catch(e) { return data; }
    }
    await new Promise(r => setTimeout(r, 1000));
  }
  return null;
}

async function putAnswer(code, sdp) {
  await apiCall(`/room/${code}/answer`, { method: 'PUT', body: JSON.stringify(sdp) });
}

async function pollAnswer(code) {
  // Immediate read — Worker no longer long-polls
  const data = await apiCall(`/room/${code}/answer`);
  if (data && data !== 'null') {
    try { return typeof data === 'string' ? JSON.parse(data) : data; } catch(e) { return data; }
  }
  return null;
}

async function deleteRoom(code) {
  try { await apiCall(`/room/${code}`, { method: 'DELETE' }); } catch(e) {}
}

// ===== FILE SELECTION =====
function updateFiles(newFiles) {
  for (const f of newFiles) {
    if (!files.find(x => x.name === f.name && x.size === f.size && x.lastModified === f.lastModified)) {
      files.push(f);
    }
  }
  renderFileList();
  btnCreateRoom.disabled = files.length === 0;
  if (currentMode === 'send') {
    setStatus(`已选择 ${files.length} 个文件`);
  }
}

function removeFile(idx) {
  files.splice(idx, 1);
  renderFileList();
  btnCreateRoom.disabled = files.length === 0;
  if (currentMode === 'send') {
    setStatus(files.length ? `已选择 ${files.length} 个文件` : '选择文件开始传输');
  }
}

function renderFileList() {
  if (files.length === 0) { fileList.innerHTML = ''; return; }
  fileList.innerHTML = files.map((f,i) => `
    <div class="file-item">
      <span class="fi-icon"><i class="fa ${getFileIcon(f)}"></i></span>
      <div class="fi-info">
        <div class="fi-name">${escHtml(f.name)}</div>
        <div class="fi-size">${fmtSize(f.size)}</div>
      </div>
      <span class="fi-remove" onclick="window._removeFile(${i})"><i class="fa fa-times-circle"></i></span>
    </div>
  `).join('');
}
window._removeFile = removeFile;

function getFileIcon(f) {
  const ext = (f.name.split('.').pop()||'').toLowerCase();
  const map = { zip:'fa-file-archive', rar:'fa-file-archive', '7z':'fa-file-archive',
    pdf:'fa-file-pdf', doc:'fa-file-word', docx:'fa-file-word',
    xls:'fa-file-excel', xlsx:'fa-file-excel', ppt:'fa-file-powerpoint', pptx:'fa-file-powerpoint',
    jpg:'fa-file-image', jpeg:'fa-file-image', png:'fa-file-image', gif:'fa-file-image', webp:'fa-file-image',
    mp4:'fa-file-video', mkv:'fa-file-video', avi:'fa-file-video', mov:'fa-file-video',
    mp3:'fa-file-audio', wav:'fa-file-audio', flac:'fa-file-audio',
    exe:'fa-file-code', dmg:'fa-file-code', iso:'fa-file-code',
    txt:'fa-file-alt', md:'fa-file-alt', json:'fa-file-code', js:'fa-file-code', py:'fa-file-code',
    html:'fa-file-code', css:'fa-file-code' };
  return map[ext] || 'fa-file';
}

function escHtml(s) {
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

// ===== DROP ZONE =====
dropZone.onclick = () => fileInput.click();
dropZone.ondragover = e => { e.preventDefault(); dropZone.classList.add('drag-over'); };
dropZone.ondragleave = () => dropZone.classList.remove('drag-over');
dropZone.ondrop = e => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  if (e.dataTransfer.files.length) updateFiles(e.dataTransfer.files);
};
fileInput.onchange = () => { if (fileInput.files.length) updateFiles(fileInput.files); fileInput.value = ''; };

// ===== SPEED GRAPH =====
function drawSpeedGraph() {
  const canvas = speedCanvas, ctx = canvas.getContext('2d');
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W; canvas.height = H;
  if (speedHistory.length < 2) return;
  const maxSpeed = Math.max(...speedHistory, 1);
  ctx.clearRect(0, 0, W, H);

  // Draw grid
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  for (let i = 1; i < 4; i++) {
    const y = (H * i) / 4;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.font = '10px sans-serif';
    ctx.fillText((maxSpeed * (4-i) / 4).toFixed(0) + ' MB/s', 4, y - 2);
  }

  // Draw line
  const gradient = ctx.createLinearGradient(0, 0, W, 0);
  gradient.addColorStop(0, '#b8a0ff'); gradient.addColorStop(1, '#64c8ff');
  ctx.strokeStyle = gradient; ctx.lineWidth = 2; ctx.lineJoin = 'round';
  ctx.beginPath();
  for (let i = 0; i < speedHistory.length; i++) {
    const x = (i / Math.max(speedHistory.length - 1, 1)) * W;
    const y = H - (speedHistory[i] / maxSpeed) * H;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Fill below
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
  const fillGrad = ctx.createLinearGradient(0, 0, 0, H);
  fillGrad.addColorStop(0, 'rgba(184,160,255,0.25)'); fillGrad.addColorStop(1, 'rgba(184,160,255,0.02)');
  ctx.fillStyle = fillGrad; ctx.fill();
}

// Helper: wait for ICE gathering to complete
function waitForIceComplete(pc) {
  return new Promise(resolve => {
    if (pc.iceGatheringState === 'complete') { resolve(); return; }
    var handler = function() {
      if (pc.iceGatheringState === 'complete') {
        pc.removeEventListener('icegatheringstatechange', handler);
        resolve();
      }
    };
    pc.addEventListener('icegatheringstatechange', handler);
    // Host candidates are instant — timeout after 3s
    setTimeout(function() {
      pc.removeEventListener('icegatheringstatechange', handler);
      resolve();
    }, 3000);
  });
}

// ===== WEBRTC (Receiver) =====
async function startReceive(room) {
  roomCodeVal = room;
  setStatus('正在连接发送端...', '');
  progressSection.classList.add('visible');

  pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

  pc.oniceconnectionstatechange = () => {
    var st = pc.iceConnectionState;
    setStatus('ICE: ' + st, st === 'connected' ? 'connected' : st === 'failed' ? 'error' : '');
    if (st === 'connected') setStatus('已连接，等待文件...', 'connected');
  };

  pc.onicegatheringstatechange = () => {
    console.log('ICE gathering:', pc.iceGatheringState);
  };

  // Log ICE candidates for debugging
  pc.onicecandidate = function(e) {
    if (e.candidate) {
      console.log('ICE candidate:', e.candidate.candidate);
    } else {
      console.log('ICE candidates done (null candidate)');
    }
  };

  pc.ondatachannel = (e) => {
    dc = e.channel;
    setupDataChannel(dc, 'receive');
  };

  // Get offer from signaling server
  setStatus('获取连接信息...', '');
  const offer = await getOffer(room);
  if (!offer) { setStatus('未找到发送端，请确认房间号正确', 'error'); return; }

  setStatus('正在建立 P2P 连接...', '');
  await pc.setRemoteDescription(new RTCSessionDescription(offer));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  // CRITICAL: Wait for ICE candidates to be gathered before sending answer
  setStatus('收集网络信息...', '');
  await waitForIceComplete(pc);

  // Send complete answer (with all ICE candidates embedded)
  await putAnswer(room, pc.localDescription);
  setStatus('已发送应答，等待 P2P 连接...', '');
}

// ===== WEBRTC (Sender) =====
async function startSend() {
  if (!files.length) return;
  roomCodeVal = await createRoom();
  if (!roomCodeVal) { setStatus('创建房间失败，请重试', 'error'); return; }

  // Show room info + QR
  roomCode.textContent = roomCodeVal;
  roomInfo.style.display = 'block';
  // Generate QR with room URL
  const qrUrl = `https://xi-han.top/html/tool/lan-transfer-v2.html?room=${roomCodeVal}`;
  const qrDiv = $('qrcode'); qrDiv.innerHTML = '';
  new QRCode(qrDiv, { text: qrUrl, width: 200, height: 200, colorDark:'#0f1324', colorLight:'#ffffff' });
  setStatus(`房间已创建，等待接收端加入...`, '');
  progressSection.classList.add('visible');

  // Create peer connection
  pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

  // Create data channel before offer
  dc = pc.createDataChannel('file-transfer', { ordered: true });
  dc.binaryType = 'arraybuffer';
  dc.bufferedAmountLowThreshold = MAX_BUFFER / 2;

  pc.oniceconnectionstatechange = () => {
    var st = pc.iceConnectionState;
    setStatus('ICE: ' + st, st === 'connected' ? 'connected' : st === 'failed' ? 'error' : '');
    if (st === 'connected') {
      setStatus('已连接，准备发送文件...', 'connected');
      startFileTransfer();
    }
  };

  pc.onicegatheringstatechange = () => {
    console.log('ICE gathering:', pc.iceGatheringState);
  };

  setupDataChannel(dc, 'send');

  // Create and send offer AFTER ICE gathering completes
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  // CRITICAL: Wait for ICE gathering before sending offer
  setStatus('收集网络信息...', '');
  await waitForIceComplete(pc);

  // Send complete offer (with all ICE candidates embedded)
  await putOffer(roomCodeVal, pc.localDescription);
  setStatus('已发送连接请求，等待应答...', '');

  // Retry-based answer polling (beats KV eventual consistency across edge nodes)
  setStatus('等待接收端应答...', '');
  let answer = null;
  for (let i = 0; i < 40; i++) {
    answer = await pollAnswer(roomCodeVal);
    if (answer) break;
    await new Promise(r => setTimeout(r, 800));
  }
  if (!answer) { setStatus('等待应答超时 (40次重试)', 'error'); return; }

  await pc.setRemoteDescription(new RTCSessionDescription(answer));
}

// ===== DataChannel Setup =====
function setupDataChannel(channel, role) {
  channel.binaryType = 'arraybuffer';  // MUST be arraybuffer for binary chunks

  channel.onopen = () => {
    if (role === 'receive') setStatus('DataChannel 已打开', 'connected');
  };

  channel.onclose = () => { setStatus('传输通道关闭', ''); };

  channel.onerror = (e) => { console.error('DC error:', e); };

  if (role === 'receive') {
    // Receiver: keep onmessage SYNCHRONOUS and FAST.
    // SCTP backpressure is triggered when the JS handler is slow —
    // DOM updates in the hot path kill throughput.
    var queue = [];            // ArrayBuffer queue (fast push, no DOM)
    var fileMeta = null;
    var totalBytes = 0;
    var lastUIUpdate = 0;
    var lastSpeedSample = 0;
    var lastSampleBytes = 0;
    var speedSamples = [];

    channel.onmessage = function(e) {
      if (typeof e.data === 'string') {
        var msg = JSON.parse(e.data);
        if (msg.type === 'file-start') {
          fileMeta = msg;
          queue = [];
          totalBytes = 0;
          lastUIUpdate = lastSpeedSample = Date.now();
          lastSampleBytes = 0;
          speedSamples = [];
          progressFile.textContent = msg.name;
          progressPercent.textContent = '0%';
          progressBar.style.width = '0%';
          statSent.textContent = '0 / ' + fmtSize(msg.size);
          statSpeed.textContent = '0 MB/s';
          statETA.textContent = '--';
          setStatus('接收中: ' + msg.name, 'connected');
        } else if (msg.type === 'file-end') {
          queueDone();
        } else if (msg.type === 'transfer-complete') {
          setStatus('所有文件传输完成 ✅', 'connected');
          cleanup();
        }
      } else if (e.data instanceof ArrayBuffer) {
        queue.push(e.data);  // Fast path: no DOM, no Blob allocation
        totalBytes += e.data.byteLength;
      }
    };

    // UI updates on a 500ms timer (off the hot path)
    var uiTimer = setInterval(function() {
      if (!fileMeta || queue.length === 0) return;
      var now = Date.now();
      if (now - lastUIUpdate < 400) return;
      lastUIUpdate = now;

      var pct = Math.min(100, (totalBytes / fileMeta.size) * 100);
      progressPercent.textContent = pct.toFixed(1) + '%';
      progressBar.style.width = pct + '%';
      statSent.textContent = fmtSize(totalBytes) + ' / ' + fmtSize(fileMeta.size);

      // Speed
      if (now - lastSpeedSample >= 500) {
        var sampleBytes = totalBytes - lastSampleBytes;
        var speed = sampleBytes / ((now - lastSpeedSample) / 1000);
        speedSamples.push(speed);
        if (speedSamples.length > 4) speedSamples.shift();
        var avgSpeed = speedSamples.reduce(function(a,b){return a+b;},0) / speedSamples.length;
        statSpeed.textContent = (avgSpeed / 1048576).toFixed(1) + ' MB/s';
        speedHistory.push(avgSpeed / 1048576);
        if (speedHistory.length > 60) speedHistory.shift();
        drawSpeedGraph();
        var remaining = fileMeta.size - totalBytes;
        if (avgSpeed > 0) statETA.textContent = fmtTime(remaining / avgSpeed);
        lastSampleBytes = totalBytes;
        lastSpeedSample = now;
      }
    }, 200);

    function queueDone() {
      clearInterval(uiTimer);
      // Assemble all ArrayBuffers into one Blob
      var blob = new Blob(queue, { type: fileMeta.mime || 'application/octet-stream' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = fileMeta.name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 5000);

      setStatus('✅ ' + fileMeta.name + ' 接收完成 (' + fmtSize(totalBytes) + ')', 'connected');
      progressPercent.textContent = '100%';
      progressBar.style.width = '100%';
      statSent.textContent = fmtSize(totalBytes);
      statSpeed.textContent = '0 MB/s';
      statETA.textContent = '完成';
      showToast('文件接收完成！');
      fileMeta = null; queue = [];
    }
  }
}

// ===== File Transfer (Sender) =====
async function startFileTransfer() {
  // Wait for DataChannel to actually open (may fire after ICE connected)
  if (dc && dc.readyState !== 'open') {
    setStatus('等待 DataChannel 就绪...', '');
    await new Promise(function(resolve, reject) {
      var timeout = setTimeout(function() {
        reject(new Error('DataChannel 超时'));
      }, 10000);
      dc.addEventListener('open', function() {
        clearTimeout(timeout);
        resolve();
      }, { once: true });
    }).catch(function() {
      setStatus('DataChannel 连接超时', 'error');
      return;
    });
    if (dc.readyState !== 'open') return;
  }
  if (!dc || dc.readyState !== 'open') {
    setStatus('DataChannel 未就绪', 'error'); return;
  }

  const totalSize = files.reduce((s, f) => s + f.size, 0);
  setStatus(`开始发送 ${files.length} 个文件 (${fmtSize(totalSize)})`, 'connected');

  const speedSamples = [];
  let totalSent = 0, lastSampleBytes = 0, lastSampleTime = Date.now();

  for (let fi = 0; fi < files.length; fi++) {
    const file = files[fi];
    progressFile.textContent = `${file.name} (${fi+1}/${files.length})`;
    progressPercent.textContent = '0%';
    progressBar.style.width = '0%';
    statSent.textContent = '0 / ' + fmtSize(file.size);

    // Classic File.slice() + FileReader approach — reliable and battle-tested
    dc.send(JSON.stringify({
      type: 'file-start',
      name: file.name,
      size: file.size,
      mime: file.type || 'application/octet-stream',
    }));

    var offset = 0;
    var fileSentLocal = 0;
    var startTime = Date.now();
    var lastUIUpdate = 0;
    var chunkCount = 0;

    while (offset < file.size) {
      // Burst-send up to 2MB before checking flow control
      var burstSent = 0;
      while (offset < file.size && burstSent < 2 * 1024 * 1024) {
        var end = Math.min(offset + CHUNK_SIZE, file.size);
        var chunk = await new Promise(function(resolve) {
          var fr = new FileReader();
          fr.onload = function() { resolve(new Uint8Array(fr.result)); };
          fr.onerror = function(e) { console.error('FileReader error:', e); resolve(null); };
          fr.readAsArrayBuffer(file.slice(offset, end));
        });
        
        if (!chunk) { setStatus('文件读取失败', 'error'); return; }

        dc.send(chunk);
        offset = end;
        burstSent += chunk.byteLength;
        fileSentLocal += chunk.byteLength;
        totalSent += chunk.byteLength;
        chunkCount++;

        if (chunkCount % 64 === 0) {
          console.log('#' + chunkCount, fmtSize(totalSent), 'buf=' + fmtSize(dc.bufferedAmount));
        }

        // UI update
        var now = Date.now();
        if (now - lastUIUpdate >= 200) {
          var pct = Math.min(100, (fileSentLocal / file.size) * 100);
          progressPercent.textContent = pct.toFixed(1) + '%';
          progressBar.style.width = pct + '%';
          statSent.textContent = fmtSize(fileSentLocal) + ' / ' + fmtSize(file.size);
          var elapsed = now - lastSampleTime;
          if (elapsed >= 200 && totalSent > lastSampleBytes) {
            var sampleBytes = totalSent - lastSampleBytes;
            var speed = sampleBytes / (elapsed / 1000);
            speedSamples.push(speed);
            if (speedSamples.length > 4) speedSamples.shift();
            var avgSpeed = speedSamples.reduce(function(a,b){return a+b;},0) / speedSamples.length;
            statSpeed.textContent = (avgSpeed / 1048576).toFixed(1) + ' MB/s';
            speedHistory.push(avgSpeed / 1048576);
            if (speedHistory.length > 60) speedHistory.shift();
            drawSpeedGraph();
            var remaining = totalSize - totalSent;
            if (avgSpeed > 0) statETA.textContent = fmtTime(remaining / avgSpeed);
            lastSampleBytes = totalSent;
            lastSampleTime = now;
          }
          lastUIUpdate = now;
        }
      }

      // After burst, wait for buffer to drain before next burst
      while (dc.bufferedAmount > 2 * 1024 * 1024) {
        await new Promise(function(r) { setTimeout(r, 20); });
      }
    }

    // Signal end of file
    dc.send(JSON.stringify({ type: 'file-end' }));
    showToast(`${file.name} 发送完成 (${((Date.now()-startTime)/1000).toFixed(1)}s)`);
  }

  // All files done
  dc.send(JSON.stringify({ type: 'transfer-complete' }));
  setStatus(`全部完成! 共 ${files.length} 个文件, ${fmtSize(totalSize)}`, 'connected');
  statSpeed.textContent = '0 MB/s';
  statETA.textContent = '完成';
  showToast('所有文件传输完成！');
  cleanup();
}

// ===== Cleanup =====
function cleanup() {
  if (roomCodeVal) {
    deleteRoom(roomCodeVal);
    roomCodeVal = null;
  }
  if (dc) { try { dc.close(); } catch(e) {} dc = null; }
  if (pc) { try { pc.close(); } catch(e) {} pc = null; }
}

// ===== Button Handlers =====
btnCreateRoom.onclick = async () => {
  if (!files.length) return;
  btnCreateRoom.disabled = true;
  btnCreateRoom.innerHTML = '<i class="fa fa-spinner fa-pulse"></i> 创建中...';
  try {
    await startSend();
  } catch(e) {
    setStatus('创建失败: ' + e.message, 'error');
    btnCreateRoom.disabled = false;
    btnCreateRoom.innerHTML = '<i class="fa fa-qrcode"></i> 创建房间 & 生成二维码';
  }
};

btnJoinRoom.onclick = async () => {
  const code = roomInput.value.trim();
  if (!/^\d{6}$/.test(code)) { showToast('请输入6位数字房间号'); return; }
  roomInput.disabled = true;
  btnJoinRoom.disabled = true;
  btnJoinRoom.innerHTML = '<i class="fa fa-spinner fa-pulse"></i> 加入中...';
  try {
    await startReceive(code);
  } catch(e) {
    setStatus('加入失败: ' + e.message, 'error');
    roomInput.disabled = false;
    btnJoinRoom.disabled = false;
    btnJoinRoom.innerHTML = '<i class="fa fa-sign-in"></i> 加入';
  }
};

// ===== URL param: auto-join from QR scan =====
(function checkUrlParam() {
  const params = new URLSearchParams(window.location.search);
  const room = params.get('room');
  if (room && /^\d{6}$/.test(room)) {
    switchMode('receive');
    roomInput.value = room;
    setTimeout(() => btnJoinRoom.click(), 800);
  }
})();

// ===== Keyboard =====
roomInput.onkeydown = (e) => { if (e.key === 'Enter') btnJoinRoom.click(); };
roomInput.oninput = (e) => { roomInput.value = roomInput.value.replace(/\D/g, '').slice(0,6); };

// ===== Page unload cleanup =====
window.addEventListener('beforeunload', cleanup);

})();
</script>
