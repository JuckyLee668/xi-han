<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f1324">
  <title>Markdown → PDF 转换器</title>
  <link rel="stylesheet" href="../../assets/css/font-awesome-6.0.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Inter", "Microsoft YaHei", "PingFang SC", sans-serif;
      background: linear-gradient(135deg, #0f1324 0%, #1a1f3a 25%, #0d0f1f 50%, #1a1f3a 75%, #0f1324 100%);
      background-attachment: fixed;
      color: #f5f5ff;
      min-height: 100vh;
      padding: 20px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 50%, rgba(184, 160, 255, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(100, 200, 255, 0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .page-wrapper {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
    }

    .hero-card {
      background: rgba(22, 28, 48, 0.92);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
      backdrop-filter: blur(14px);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .back-link {
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .back-link:hover { color: #b8a0ff; }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header-icon {
      font-size: 2.5rem;
      color: #b8a0ff;
      margin-bottom: 10px;
      display: block;
    }

    h1 {
      font-size: clamp(1.6rem, 3.5vw, 2.2rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #b8a0ff, #64c8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .subtitle {
      color: rgba(255,255,255,0.5);
      font-size: 0.95rem;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      align-items: center;
    }

    .toolbar button {
      background: linear-gradient(135deg, #b8a0ff, #8b6fe8);
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .toolbar button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(184, 160, 255, 0.3);
    }

    .toolbar button:active { transform: translateY(0); }

    .toolbar button.secondary {
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.75);
    }
    .toolbar button.secondary:hover {
      background: rgba(255,255,255,0.12);
      box-shadow: none;
    }

    .toolbar button.danger {
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.6);
    }
    .toolbar button.danger:hover {
      background: rgba(255,107,107,0.12);
      color: #ff6b6b;
    }

    .toolbar .right-group {
      margin-left: auto;
      display: flex;
      gap: 10px;
    }

    /* PDF download button special */
    .btn-pdf {
      background: linear-gradient(135deg, #ff6b6b, #ee5a24) !important;
    }
    .btn-pdf:hover {
      box-shadow: 0 6px 20px rgba(255, 107, 107, 0.3) !important;
    }

    .btn-print {
      background: linear-gradient(135deg, #64c8ff, #3498db) !important;
    }
    .btn-print:hover {
      box-shadow: 0 6px 20px rgba(100, 200, 255, 0.3) !important;
    }

    /* Editor layout */
    .editor-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      min-height: 500px;
    }

    .editor-pane {
      display: flex;
      flex-direction: column;
    }

    .pane-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-bottom: none;
      border-radius: 12px 12px 0 0;
      font-size: 0.85rem;
      font-weight: 600;
      color: rgba(255,255,255,0.6);
    }
    .pane-header i { color: #b8a0ff; }
    .pane-header .count {
      margin-left: auto;
      font-weight: 400;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.35);
    }

    .editor-input {
      flex: 1;
      min-height: 450px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 0 0 12px 12px;
      background: rgba(0,0,0,0.3);
      color: #f5f5ff;
      font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
      font-size: 0.9rem;
      line-height: 1.7;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
      tab-size: 2;
    }
    .editor-input:focus {
      border-color: #b8a0ff;
      box-shadow: 0 0 0 3px rgba(184, 160, 255, 0.1);
    }
    .editor-input::placeholder { color: rgba(255,255,255,0.2); }

    /* Preview pane */
    .preview-output {
      flex: 1;
      min-height: 450px;
      padding: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 0 0 12px 12px;
      background: white;
      color: #333;
      font-size: 13px;
      line-height: 1.6;
      overflow-y: auto;
      word-wrap: break-word;
      font-family: "Inter", "Microsoft YaHei", sans-serif;
    }

    .preview-output:empty::before {
      content: "PDF 预览将实时显示...（白色背景模拟纸张）";
      color: #bbb;
      font-style: italic;
    }

    /* PDF preview styles (clean white background) */
    .preview-output h1,
    .preview-output h2,
    .preview-output h3,
    .preview-output h4 {
      margin-top: 1em;
      margin-bottom: 0.4em;
      font-weight: 700;
    }
    .preview-output h1 { font-size: 22px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
    .preview-output h2 { font-size: 18px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
    .preview-output h3 { font-size: 16px; }
    .preview-output p { margin: 0.6em 0; }
    .preview-output a { color: #0366d6; }
    .preview-output pre {
      background: #f6f8fa;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      padding: 12px;
      overflow-x: auto;
      margin: 0.8em 0;
      font-size: 12px;
    }
    .preview-output pre code { background: none; padding: 0; font-size: 12px; }
    .preview-output code {
      background: #f0f0f0;
      padding: 2px 5px;
      border-radius: 3px;
      font-size: 0.9em;
    }
    .preview-output blockquote {
      border-left: 3px solid #b8a0ff;
      padding: 6px 14px;
      margin: 0.8em 0;
      background: #f8f8ff;
      color: #555;
    }
    .preview-output ul, .preview-output ol { padding-left: 24px; margin: 0.5em 0; }
    .preview-output table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.8em 0;
      font-size: 12px;
    }
    .preview-output th, .preview-output td {
      padding: 6px 10px;
      border: 1px solid #ddd;
    }
    .preview-output th { background: #f6f8fa; font-weight: 600; }
    .preview-output img { max-width: 100%; }
    .preview-output hr { border: none; border-top: 1px solid #eee; margin: 1em 0; }
    .preview-output input[type="checkbox"] { margin-right: 4px; }

    /* Loading overlay */
    .loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(4px);
    }
    .loading-overlay.show { display: flex; }

    .loading-box {
      background: rgba(22,28,48,0.95);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 40px 50px;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    }
    .loading-box .spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top: 3px solid #b8a0ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    .loading-box p { color: rgba(255,255,255,0.7); font-size: 1rem; }
    .loading-box small { color: rgba(255,255,255,0.4); font-size: 0.8rem; display: block; margin-top: 8px; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(22,28,48,0.96);
      border: 1px solid rgba(130,220,170,0.3);
      color: #82dcaa;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 999;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.error {
      border-color: rgba(255,107,107,0.3);
      color: #ff6b6b;
    }

    /* Sample selector */
    .sample-select {
      padding: 9px 14px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      font-size: 0.85rem;
      background: rgba(0,0,0,0.25);
      color: rgba(255,255,255,0.7);
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }
    .sample-select:focus { border-color: #b8a0ff; }
    .sample-select option { background: #1a1f3a; color: #f5f5ff; }

    /* Responsive */
    @media (max-width: 768px) {
      body { padding: 12px; }
      .hero-card { padding: 16px; border-radius: 18px; }
      .editor-layout { grid-template-columns: 1fr; min-height: auto; }
      .editor-input, .preview-output { min-height: 280px; }
      .toolbar .right-group { margin-left: 0; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .toolbar button { justify-content: center; }
      .sample-select { width: 100%; }
      .loading-box { padding: 28px 24px; margin: 0 16px; }
    }

    @media (min-width: 768px) {
      body { padding: 6vh 24px; }
      .hero-card { padding: 36px; border-radius: 32px; }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div class="hero-card">
      <div class="top-bar">
        <div></div>
        <a href="../tools.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回工具</a>
      </div>

      <div class="header">
        <i class="fas fa-file-pdf header-icon" style="color: #ff6b6b;"></i>
        <h1>Markdown → PDF 转换器</h1>
        <p class="subtitle">在线将 Markdown 转换为 PDF 文档 · 所见即所得</p>
      </div>

      <div class="toolbar">
        <select class="sample-select" id="sampleSelect">
          <option value="" disabled selected>📄 加载示例...</option>
          <option value="report">工作报告</option>
          <option value="resume">个人简历</option>
          <option value="tutorial">教程文档</option>
        </select>
        <div class="right-group">
          <button id="clearBtn" class="danger"><i class="fas fa-trash"></i> 清空</button>
          <button id="printBtn" class="btn-print"><i class="fas fa-print"></i> 打印</button>
          <button id="downloadPdfBtn" class="btn-pdf"><i class="fas fa-file-pdf"></i> 导出 PDF</button>
        </div>
      </div>

      <div class="editor-layout">
        <div class="editor-pane">
          <div class="pane-header">
            <i class="fab fa-markdown"></i> Markdown
            <span class="count" id="charCount">0 字符</span>
          </div>
          <textarea class="editor-input" id="mdInput" placeholder="在此输入 Markdown 内容..." spellcheck="false"></textarea>
        </div>
        <div class="editor-pane">
          <div class="pane-header">
            <i class="fas fa-file-alt"></i> PDF 预览
            <span class="count">白色背景 = 纸张效果</span>
          </div>
          <div class="preview-output" id="preview"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Loading overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-box">
      <div class="spinner"></div>
      <p>正在生成 PDF...</p>
      <small>文档越长，处理时间越久</small>
    </div>
  </div>

  <div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg"></span></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>
    marked.setOptions({ breaks: true, gfm: true });

    const mdInput = document.getElementById('mdInput');
    const preview = document.getElementById('preview');
    const charCount = document.getElementById('charCount');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    const loadingOverlay = document.getElementById('loadingOverlay');

    // Render markdown to preview
    function render() {
      const raw = mdInput.value;
      charCount.textContent = raw.length + ' 字符';
      if (!raw.trim()) { preview.innerHTML = ''; return; }
      try {
        preview.innerHTML = marked.parse(raw);
      } catch (e) {
        preview.innerHTML = `<span style="color:#c00;"><i class="fas fa-exclamation-triangle"></i> 解析错误: ${e.message}</span>`;
      }
    }

    let renderTimer;
    mdInput.addEventListener('input', () => {
      clearTimeout(renderTimer);
      renderTimer = setTimeout(render, 150);
    });

    // Toast
    function showToast(msg, isError = false) {
      toastMsg.textContent = msg;
      toast.className = 'toast' + (isError ? ' error' : '');
      const icon = toast.querySelector('i');
      icon.className = 'fas ' + (isError ? 'fa-exclamation-circle' : 'fa-check-circle');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Show/hide loading
    function showLoading() { loadingOverlay.classList.add('show'); }
    function hideLoading() { loadingOverlay.classList.remove('show'); }

    // Download PDF
    document.getElementById('downloadPdfBtn').addEventListener('click', async () => {
      const raw = mdInput.value.trim();
      if (!raw) { showToast('请先输入 Markdown 内容', true); return; }

      showLoading();
      try {
        // Build a clean print-quality container
        const printEl = document.createElement('div');
        printEl.innerHTML = preview.innerHTML;
        printEl.style.cssText = `
          padding: 40px 50px;
          font-family: "Inter", "Microsoft YaHei", -apple-system, sans-serif;
          font-size: 13px;
          line-height: 1.65;
          color: #222;
          background: white;
          width: 210mm;
          margin: 0 auto;
        `;

        // Re-style for print quality
        const style = document.createElement('style');
        style.textContent = `
          h1, h2, h3, h4 { margin-top: 1em; margin-bottom: 0.4em; font-weight: 700; }
          h1 { font-size: 22px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
          h2 { font-size: 18px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
          h3 { font-size: 16px; }
          p { margin: 0.6em 0; }
          a { color: #0366d6; }
          pre {
            background: #f6f8fa; border: 1px solid #e1e4e8; border-radius: 6px;
            padding: 12px; overflow-x: auto; margin: 0.8em 0; font-size: 12px;
          }
          pre code { background: none; padding: 0; font-size: 12px; }
          code { background: #f0f0f0; padding: 2px 5px; border-radius: 3px; font-size: 0.9em; }
          blockquote {
            border-left: 3px solid #b8a0ff; padding: 6px 14px;
            margin: 0.8em 0; background: #f8f8ff; color: #555;
          }
          ul, ol { padding-left: 24px; margin: 0.5em 0; }
          table { width: 100%; border-collapse: collapse; margin: 0.8em 0; font-size: 12px; }
          th, td { padding: 6px 10px; border: 1px solid #ddd; }
          th { background: #f6f8fa; font-weight: 600; }
          img { max-width: 100%; }
          hr { border: none; border-top: 1px solid #eee; margin: 1em 0; }
        `;
        printEl.prepend(style);

        // Temporarily append to body for html2pdf rendering
        printEl.style.position = 'fixed';
        printEl.style.left = '-9999px';
        printEl.style.top = '0';
        document.body.appendChild(printEl);

        const opt = {
          margin:        [15, 15, 15, 15], // mm
          filename:      'document.pdf',
          image:         { type: 'jpeg', quality: 0.95 },
          html2canvas:   { scale: 2, useCORS: true, letterRendering: true },
          jsPDF:         { unit: 'mm', format: 'a4', orientation: 'portrait' },
          pagebreak:     { mode: ['avoid-all', 'css', 'legacy'] }
        };

        await html2pdf().set(opt).from(printEl).save();
        document.body.removeChild(printEl);
        hideLoading();
        showToast('PDF 已下载');
      } catch (e) {
        hideLoading();
        showToast('导出失败：' + e.message, true);
        console.error('PDF error:', e);
      }
    });

    // Print (browser native — user can "Save as PDF")
    document.getElementById('printBtn').addEventListener('click', () => {
      const raw = mdInput.value.trim();
      if (!raw) { showToast('请先输入 Markdown 内容', true); return; }

      const w = window.open('', '_blank');
      w.document.write(`<!DOCTYPE html><html><head>
        <meta charset="UTF-8">
        <title>Markdown 打印</title>
        <style>
          body { font-family: "Inter", "Microsoft YaHei", sans-serif; max-width: 800px; margin: 0 auto; padding: 40px; line-height: 1.7; color: #222; font-size: 13px; }
          h1, h2, h3, h4 { margin-top: 1em; margin-bottom: 0.4em; font-weight: 700; }
          h1 { font-size: 22px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
          h2 { font-size: 18px; border-bottom: 1px solid #eee; padding-bottom: 4px; }
          h3 { font-size: 16px; }
          p { margin: 0.6em 0; }
          a { color: #0366d6; }
          pre { background: #f6f8fa; border: 1px solid #e1e4e8; border-radius: 6px; padding: 12px; overflow-x: auto; margin: 0.8em 0; font-size: 12px; }
          pre code { background: none; padding: 0; font-size: 12px; }
          code { background: #f0f0f0; padding: 2px 5px; border-radius: 3px; font-size: 0.9em; }
          blockquote { border-left: 3px solid #b8a0ff; padding: 6px 14px; margin: 0.8em 0; background: #f8f8ff; color: #555; }
          ul, ol { padding-left: 24px; margin: 0.5em 0; }
          table { width: 100%; border-collapse: collapse; margin: 0.8em 0; font-size: 12px; }
          th, td { padding: 6px 10px; border: 1px solid #ddd; }
          th { background: #f6f8fa; font-weight: 600; }
          img { max-width: 100%; }
          hr { border: none; border-top: 1px solid #eee; margin: 1em 0; }
          @media print { body { padding: 20px; } }
        </style>
      </head><body>${preview.innerHTML}</body></html>`);
      w.document.close();
      w.focus();
      setTimeout(() => w.print(), 500);
    });

    // Clear
    document.getElementById('clearBtn').addEventListener('click', () => {
      mdInput.value = '';
      render();
      showToast('已清空');
    });

    // Samples
    const samples = {
      report: `# 2024 年度工作总结报告

| API 响应时间 | 850ms | 210ms | 75% |

> 全年共上线 **23 个** 新功能，其中 8 个为重点项目。

- **智能搜索 V3** — 搜索准确率提升 40%
- **实时协作编辑** — 支持多人同时编辑

> 以下为明年重点工作方向：

- ✅ 完成核心模块重构
- 🔄 将测试覆盖率提升至 90% 以上
- 🔄 建立自动化运维体系
- 📝 完善技术文档和开发规范

---

*报告完毕*
`,

      resume: `# 李四

**全栈开发工程师** · 5 年经验 · 本科

Python 是一种易学且功能强大的编程语言。本教程将带你快速掌握 Python 基础。

### 安装 Python

验证安装：

\`\`\`bash

## 基础语法

### 变量与数据类型

\`\`\`python
# 基本类型
name = "小明"       # 字符串
age = 25            # 整数
height = 1.75       # 浮点数
is_student = True   # 布尔值

# 集合类型
fruits = ["苹果", "香蕉", "橘子"]
scores = {"数学": 95, "语文": 88}
\`\`\`

### 条件判断

\`\`\`python
score = 85

if score >= 90:
    grade = "优秀"
elif score >= 80:
    grade = "良好"
elif score >= 60:
    grade = "及格"
else:
    grade = "不及格"

print(f"成绩等级: {grade}")
# 输出: 成绩等级: 良好
\`\`\`

### 循环

\`\`\`python
# for 循环
for fruit in ["苹果", "香蕉", "橘子"]:
    print(f"我喜欢吃{fruit}")

# while 循环
count = 0
while count < 3:
    print(f"第 {count + 1} 次")
    count += 1
\`\`\`

## 函数

\`\`\`python
def greet(name, greeting="你好"):
    """向指定的人问好"""
    return f"{greeting}，{name}！"

print(greet("小明"))        # 你好，小明！
print(greet("Tom", "Hello")) # Hello，Tom！
\`\`\`
