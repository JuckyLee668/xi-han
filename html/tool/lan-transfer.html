<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f1324">
  <title>局域网文件互传</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Inter", "Microsoft YaHei", "PingFang SC", sans-serif;
      background: linear-gradient(135deg, #0f1324 0%, #1a1f3a 25%, #0d0f1f 50%, #1a1f3a 75%, #0f1324 100%);
      background-attachment: fixed;
      color: #f5f5ff;
      min-height: 100vh;
      padding: 20px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 50%, rgba(184, 160, 255, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(100, 200, 255, 0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .page-wrapper { position: relative; z-index: 1; max-width: 880px; margin: 0 auto; }

    .hero-card {
      background: rgba(22, 28, 48, 0.92);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
      backdrop-filter: blur(14px);
    }

    .top-bar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    .back-link { color: rgba(255,255,255,0.5); text-decoration: none; font-size: 0.9rem; transition: color 0.2s; display: inline-flex; align-items: center; gap: 6px; }
    .back-link:hover { color: #b8a0ff; }

    .header { text-align: center; margin-bottom: 16px; }
    .header-icon { font-size: 2.4rem; color: #82dcaa; margin-bottom: 8px; display: block; }
    h1 {
      font-size: clamp(1.5rem, 3.5vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #82dcaa, #64c8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }
    .subtitle { color: rgba(255,255,255,0.5); font-size: 0.9rem; }

    .info-bar {
      background: rgba(255,200,100,0.08); border: 1px solid rgba(255,200,100,0.15);
      border-radius: 12px; padding: 10px 14px; margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px; font-size: 0.82rem; color: #ffc864;
    }
    .info-bar i { flex-shrink: 0; }

    .tabs {
      display: flex; gap: 0; background: rgba(255,255,255,0.04);
      border-radius: 14px; border: 1px solid rgba(255,255,255,0.08);
      overflow: hidden; margin-bottom: 18px;
    }
    .tab {
      flex: 1; padding: 13px; text-align: center; cursor: pointer;
      font-weight: 600; font-size: 0.95rem; color: rgba(255,255,255,0.45);
      transition: all 0.25s ease; border: none; background: transparent; font-family: inherit;
    }
    .tab:hover { color: rgba(255,255,255,0.7); }
    .tab.send.active { background: rgba(130,220,170,0.12); color: #82dcaa; }
    .tab.recv.active { background: rgba(100,200,255,0.12); color: #64c8ff; }

    .panel { display: none; animation: fadeIn 0.3s ease; }
    .panel.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* Conn status bar */
    .conn-bar {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px; border-radius: 10px; margin-bottom: 14px;
      font-size: 0.85rem; font-weight: 500;
    }
    .conn-bar.idle { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); color: rgba(255,255,255,0.35); }
    .conn-bar.connected { background: rgba(130,220,170,0.08); border: 1px solid rgba(130,220,170,0.15); color: #82dcaa; }
    .conn-bar.waiting { background: rgba(255,200,100,0.08); border: 1px solid rgba(255,200,100,0.15); color: #ffc864; }
    .conn-bar .dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .conn-bar.idle .dot { background: rgba(255,255,255,0.2); }
    .conn-bar.connected .dot { background: #82dcaa; box-shadow: 0 0 6px rgba(130,220,170,0.5); }
    .conn-bar.waiting .dot { background: #ffc864; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    .conn-bar .conn-right { margin-left: auto; display: flex; gap: 6px; }
    .conn-bar .badge {
      padding: 2px 10px; border-radius: 20px; font-size: 0.72rem;
      background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.4);
    }
    .conn-bar .badge.room { background: rgba(130,220,170,0.12); color: #82dcaa; font-family: monospace; font-weight: 700; }

    /* Drop zone */
    .drop-zone {
      border: 2px dashed rgba(130,220,170,0.2);
      border-radius: 14px; padding: 28px 20px; text-align: center;
      cursor: pointer; transition: all 0.25s ease;
      background: rgba(130,220,170,0.02); margin-bottom: 12px;
    }
    .drop-zone:hover, .drop-zone.dragover { border-color: #82dcaa; background: rgba(130,220,170,0.06); }
    .drop-zone i { font-size: 2.2rem; color: #82dcaa; margin-bottom: 8px; display: block; }
    .drop-zone p { color: rgba(255,255,255,0.5); font-size: 0.9rem; }
    .drop-zone .hint { color: rgba(255,255,255,0.25); font-size: 0.78rem; margin-top: 4px; }
    .drop-zone.disabled { opacity: 0.35; cursor: not-allowed; }
    .drop-zone.disabled:hover { border-color: rgba(130,220,170,0.2); background: rgba(130,220,170,0.02); }

    /* File list */
    .file-list { margin-bottom: 10px; max-height: 240px; overflow-y: auto; }
    .file-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06); border-radius: 9px; margin-bottom: 5px;
    }
    .file-item .f-icon { font-size: 1.1rem; color: #82dcaa; flex-shrink: 0; }
    .file-item .f-info { flex: 1; min-width: 0; }
    .file-item .f-name { font-size: 0.85rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-item .f-size { font-size: 0.74rem; color: rgba(255,255,255,0.35); }
    .file-item .f-remove { background: none; border: none; color: rgba(255,255,255,0.25); cursor: pointer; font-size: 0.9rem; padding: 3px; transition: color 0.2s; }
    .file-item .f-remove:hover { color: #ff6b6b; }
    .empty-files { text-align: center; padding: 10px; color: rgba(255,255,255,0.2); font-size: 0.82rem; }

    .file-item .f-status { font-size: 0.7rem; padding: 2px 8px; border-radius: 20px; flex-shrink: 0; }
    .file-item .f-status.pending { background: rgba(255,200,100,0.1); color: #ffc864; }
    .file-item .f-status.done { background: rgba(130,220,170,0.1); color: #82dcaa; }
    .file-item .f-status.sending { background: rgba(100,200,255,0.1); color: #64c8ff; }

    /* Actions */
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .actions .spacer { flex: 1; }

    button { font-family: inherit; cursor: pointer; }
    .btn-primary {
      background: linear-gradient(135deg, #82dcaa, #5cc48a);
      color: white; border: none; padding: 12px 22px;
      border-radius: 11px; font-size: 0.92rem; font-weight: 600;
      transition: all 0.25s ease; display: inline-flex; align-items: center; gap: 7px;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(130,220,170,0.25); }
    .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

    .btn-blue {
      background: linear-gradient(135deg, #64c8ff, #3498db);
      color: white; border: none; padding: 12px 22px;
      border-radius: 11px; font-size: 0.92rem; font-weight: 600;
      transition: all 0.25s ease; display: inline-flex; align-items: center; gap: 7px;
    }
    .btn-blue:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(100,200,255,0.25); }
    .btn-blue:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

    .btn-danger {
      background: rgba(255,107,107,0.08);
      color: #ff6b6b; border: 1px solid rgba(255,107,107,0.15);
      padding: 12px 22px; border-radius: 11px; font-size: 0.92rem; font-weight: 600;
      transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 7px;
    }
    .btn-danger:hover { background: rgba(255,107,107,0.15); }

    .btn-full { width: 100%; justify-content: center; }

    /* Room code */
    .room-display { text-align: center; margin-bottom: 10px; display: none; }
    .room-display.show { display: block; }
    .room-code-label { font-size: 0.8rem; color: rgba(255,255,255,0.35); }
    .room-code {
      font-size: 2.6rem; font-weight: 800; letter-spacing: 0.15em;
      color: #82dcaa; font-family: "JetBrains Mono", Consolas, monospace; margin: 4px 0;
    }
    .room-copy-btn {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.5); padding: 6px 16px; border-radius: 8px;
      font-size: 0.8rem; cursor: pointer; transition: all 0.2s;
    }
    .room-copy-btn:hover { background: rgba(255,255,255,0.1); }

    /* Receive input */
    .input-group { margin-bottom: 12px; text-align: left; }
    .input-group label { display: block; font-size: 0.82rem; font-weight: 600; color: rgba(255,255,255,0.5); margin-bottom: 6px; }
    .input-group input {
      width: 100%; padding: 13px 16px;
      border: 1px solid rgba(255,255,255,0.1); border-radius: 11px;
      font-size: 1.3rem; font-weight: 700; letter-spacing: 0.3em;
      text-align: center; background: rgba(0,0,0,0.25);
      color: #64c8ff; font-family: "JetBrains Mono", Consolas, monospace;
      outline: none; transition: border-color 0.2s;
    }
    .input-group input:focus { border-color: #64c8ff; box-shadow: 0 0 0 3px rgba(100,200,255,0.1); }
    .input-group input::placeholder { letter-spacing: 0.1em; color: rgba(255,255,255,0.15); font-weight: 400; }

    /* Progress */
    .progress-wrap { margin-bottom: 10px; display: none; }
    .progress-wrap.show { display: block; }
    .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #82dcaa, #64c8ff); border-radius: 3px; width: 0%; transition: width 0.3s ease; }
    .progress-text { display: flex; justify-content: space-between; margin-top: 3px; font-size: 0.76rem; color: rgba(255,255,255,0.4); }

    /* Received files */
    .recv-header { font-size: 0.82rem; color: rgba(255,255,255,0.35); margin-bottom: 6px; margin-top: 10px; }
    .received-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 13px; background: rgba(130,220,170,0.04);
      border: 1px solid rgba(130,220,170,0.1); border-radius: 9px; margin-bottom: 5px;
    }
    .received-item .r-icon { font-size: 1.2rem; color: #82dcaa; flex-shrink: 0; }
    .received-item .r-info { flex: 1; min-width: 0; }
    .received-item .r-name { font-size: 0.85rem; font-weight: 500; }
    .received-item .r-size { font-size: 0.74rem; color: rgba(255,255,255,0.35); }
    .received-item .r-dl { color: #82dcaa; text-decoration: none; font-size: 0.85rem; font-weight: 600; transition: color 0.2s; }
    .received-item .r-dl:hover { color: #b8f0d0; }

    /* Toast */
    .toast {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(22,28,48,0.96); border: 1px solid rgba(130,220,170,0.3);
      color: #82dcaa; padding: 12px 22px; border-radius: 12px;
      font-size: 0.88rem; font-weight: 500;
      display: flex; align-items: center; gap: 8px;
      opacity: 0; transition: all 0.3s ease;
      pointer-events: none; z-index: 999; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { border-color: rgba(255,107,107,0.3); color: #ff6b6b; }

    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top: 2px solid currentColor;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Waiting overlay in recv */
    .recv-waiting { text-align: center; padding: 30px 20px; }
    .recv-waiting i { font-size: 3rem; color: #64c8ff; margin-bottom: 10px; display: block; }
    .recv-waiting p { color: rgba(255,255,255,0.45); font-size: 0.9rem; }

    @media (max-width: 768px) {
      body { padding: 12px; }
      .hero-card { padding: 16px; border-radius: 18px; }
      .room-code { font-size: 2rem; }
      .actions { flex-direction: column; }
      .actions .spacer { display: none; }
    }
    @media (min-width: 768px) {
      body { padding: 6vh 24px; }
      .hero-card { padding: 30px; border-radius: 32px; }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div class="hero-card">
      <div class="top-bar">
        <div></div>
        <a href="../tools.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回工具</a>
      </div>

      <div class="header">
        <i class="fas fa-network-wired header-icon"></i>
        <h1>局域网文件互传</h1>
        <p class="subtitle">连接保持在线 · 随时选文件 · 随选随传</p>
      </div>

      <div class="info-bar">
        <i class="fas fa-info-circle"></i>
        <span>建立连接后，发送方可随时添加文件传输，无需重新建立房间。</span>
      </div>

      <div class="tabs">
        <button class="tab send active" data-tab="send"><i class="fas fa-upload"></i> 发送方</button>
        <button class="tab recv" data-tab="recv"><i class="fas fa-download"></i> 接收方</button>
      </div>

      <!-- ==================== SEND PANEL ==================== -->
      <div class="panel active" id="panelSend">
        <!-- Connection status -->
        <div class="conn-bar idle" id="sendConnBar">
          <span class="dot"></span>
          <span id="sendConnText">未连接 — 选择文件并创建房间</span>
          <div class="conn-right">
            <span class="badge" id="sendConnBadge"></span>
          </div>
        </div>

        <!-- Room code display -->
        <div class="room-display" id="roomDisplay">
          <div class="room-code-label">📋 房间号（告诉接收方）</div>
          <div class="room-code" id="roomCode">------</div>
          <button class="room-copy-btn" onclick="copyRoomCode()"><i class="fas fa-copy"></i> 复制房间号</button>
        </div>

        <!-- Drop zone -->
        <div class="drop-zone" id="dropZone">
          <i class="fas fa-cloud-upload-alt"></i>
          <p>拖拽文件到此处，或点击选择</p>
          <div class="hint">连接建立后可随时添加文件</div>
        </div>
        <input type="file" id="fileInput" multiple hidden>

        <!-- File list -->
        <div class="file-list" id="fileList"><div class="empty-files">暂无选择文件</div></div>

        <!-- Progress -->
        <div class="progress-wrap" id="sendProgress">
          <div class="progress-bar"><div class="progress-fill" id="sendProgressFill"></div></div>
          <div class="progress-text">
            <span id="sendProgressLabel">准备中...</span>
            <span id="sendProgressPct">0%</span>
          </div>
        </div>

        <!-- Actions -->
        <div class="actions" id="sendActions">
          <button class="btn-primary" id="createRoomBtn"><i class="fas fa-play"></i> 创建房间</button>
          <button class="btn-primary" id="sendFilesBtn" style="display:none;"><i class="fas fa-upload"></i> 发送所选文件</button>
          <span class="spacer"></span>
          <button class="btn-danger" id="disconnectBtn" style="display:none;"><i class="fas fa-plug"></i> 断开连接</button>
        </div>
      </div>

      <!-- ==================== RECEIVE PANEL ==================== -->
      <div class="panel" id="panelRecv">
        <!-- Connection status -->
        <div class="conn-bar idle" id="recvConnBar">
          <span class="dot"></span>
          <span id="recvConnText">未连接 — 输入房间号加入</span>
          <div class="conn-right">
            <span class="badge" id="recvConnBadge"></span>
          </div>
        </div>

        <!-- Room input (shown when not connected) -->
        <div id="recvJoinForm">
          <div class="input-group">
            <label><i class="fas fa-key"></i> 输入发送方的房间号</label>
            <input type="text" id="roomInput" placeholder="000000" maxlength="6" autocomplete="off">
          </div>
          <button class="btn-blue btn-full" id="joinBtn" disabled><i class="fas fa-plug"></i> 加入房间</button>
        </div>

        <!-- Waiting (shown after join, before files) -->
        <div class="recv-waiting" id="recvWaiting" style="display:none;">
          <i class="fas fa-hourglass-half"></i>
          <p>已连接，等待发送方传输文件...</p>
          <div style="margin-top:10px;"><span class="spinner" style="width:24px;height:24px;border-width:3px;"></span></div>
        </div>

        <!-- Progress -->
        <div class="progress-wrap" id="recvProgress">
          <div class="progress-bar"><div class="progress-fill" id="recvProgressFill"></div></div>
          <div class="progress-text">
            <span id="recvProgressLabel">接收中...</span>
            <span id="recvProgressPct">0%</span>
          </div>
        </div>

        <!-- Received files -->
        <div id="recvFiles"></div>

        <!-- Disconnect button for receiver -->
        <div style="text-align:center;margin-top:10px;">
          <button class="btn-danger" id="recvDisconnectBtn" style="display:none;"><i class="fas fa-plug"></i> 断开连接</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg"></span></div>

  <script>
    // ===== CONFIG =====
    const SIGNAL_URL = 'https://signal.xi-han.top';
    const STUN = ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'];
    const CHUNK_SIZE = 1048576;   // 1MB per chunk
    const MAX_BUFFER = 16777216;  // 16MB buffer threshold
    const NUM_CHANNELS = 4;       // 多路并行 DataChannel 数量

    // ===== DOM =====
    const $ = id => document.getElementById(id);
    const toast = $('toast');
    const toastMsg = $('toastMsg');

    function showToast(msg, err = false) {
      toastMsg.textContent = msg;
      toast.className = 'toast' + (err ? ' error' : '');
      toast.querySelector('i').className = 'fas ' + (err ? 'fa-exclamation-circle' : 'fa-check-circle');
      toast.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function fmtSize(b) {
      if (b < 1024) return b + ' B';
      if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
      return (b / 1048576).toFixed(1) + ' MB';
    }

    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    // ===== TABS =====
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        $('panel' + tab.dataset.tab.charAt(0).toUpperCase() + tab.dataset.tab.slice(1)).classList.add('active');
      });
    });

    // ===== API =====
    async function api(path, opts = {}) {
      const r = await fetch(SIGNAL_URL + path, {
        headers: { 'Content-Type': 'application/json' },
        ...opts,
      });
      if (!r.ok) throw new Error(await r.text().catch(() => r.statusText));
      const text = await r.text();
      try { return JSON.parse(text); } catch(e) { return text; }
    }

    // ===== FILE SELECTION =====
    const dropZone = $('dropZone');
    const fileInput = $('fileInput');
    let pendingFiles = [];       // Files queued but not yet sent
    const sentFiles = [];        // Track sent file names for display

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); addFiles(Array.from(e.dataTransfer.files)); });
    fileInput.addEventListener('change', () => { addFiles(Array.from(fileInput.files)); fileInput.value = ''; });

    function addFiles(files) {
      pendingFiles = pendingFiles.concat(files);
      renderSendFiles();
      // Show "send" button if connected
      if (isConnected) {
        $('sendFilesBtn').style.display = 'inline-flex';
        $('createRoomBtn').style.display = 'none';
      }
    }

    function removePendingFile(idx) {
      pendingFiles.splice(idx, 1);
      renderSendFiles();
    }

    function renderSendFiles() {
      const el = $('fileList');
      if (pendingFiles.length === 0) {
        el.innerHTML = '<div class="empty-files">暂无选择文件</div>';
        $('sendFilesBtn').style.display = 'none';
        $('createRoomBtn').style.display = 'inline-flex';
        return;
      }
      let html = '';
      pendingFiles.forEach((f, i) => {
        const icon = f.type.startsWith('image/') ? 'fa-file-image' : f.type.startsWith('video/') ? 'fa-file-video' : 'fa-file';
        html += '<div class="file-item">' +
          '<i class="fas ' + icon + ' f-icon"></i>' +
          '<div class="f-info"><div class="f-name">' + esc(f.name) + '</div><div class="f-size">' + fmtSize(f.size) + '</div></div>' +
          '<span class="f-status pending">待发送</span>' +
          '<button class="f-remove" onclick="removePendingFile(' + i + ')"><i class="fas fa-times"></i></button></div>';
      });
      el.innerHTML = html;
      if (isConnected) {
        $('sendFilesBtn').style.display = 'inline-flex';
        $('createRoomBtn').style.display = 'none';
      } else {
        $('createRoomBtn').style.display = 'inline-flex';
      }
    }

    // ===== SENDER STATE =====
    let pc = null;
    let dcs = [];            // DataChannel array (4 channels)
    let channelsOpen = 0;
    let isConnected = false;
    let roomCode = '';
    let sendingNow = false;

    function setSendConn(state, text, badge = '') {
      const bar = $('sendConnBar');
      bar.className = 'conn-bar ' + state;
      $('sendConnText').textContent = text;
      $('sendConnBadge').textContent = badge;
    }

    let pollTimer = null;
    let answerReceived = false;

    // ===== SENDER: Create Room =====
    $('createRoomBtn').addEventListener('click', startHost);

    async function startHost() {
      if (pendingFiles.length === 0) { showToast('请先选择文件', true); return; }

      $('createRoomBtn').disabled = true;
      $('createRoomBtn').innerHTML = '<span class="spinner"></span> 创建中...';
      answerReceived = false;

      try {
        const room = await api('/room', { method: 'POST' });
        roomCode = room.code;
        $('roomCode').textContent = roomCode;
        $('roomDisplay').classList.add('show');

        setSendConn('waiting', '等待接收方加入...', '房间 ' + roomCode);

        pc = new RTCPeerConnection({ iceServers: [{ urls: STUN }] });
        dcs = [];
        channelsOpen = 0;

        // Create 4 parallel DataChannels
        for (let i = 0; i < NUM_CHANNELS; i++) {
          const dc = pc.createDataChannel('ft-' + i, { ordered: true });
          dc.bufferedAmountLowThreshold = MAX_BUFFER / 2;
          dcs.push(dc);

          dc.onopen = () => {
            channelsOpen++;
            if (channelsOpen === NUM_CHANNELS) {
              isConnected = true;
              setSendConn('connected', '已连接 — 可随时添加文件发送', '房间 ' + roomCode);
              $('createRoomBtn').style.display = 'none';
              $('disconnectBtn').style.display = 'inline-flex';
              $('sendFilesBtn').style.display = 'inline-flex';
              showToast('接收方已加入！');
              flushSendQueue();
            }
          };

          dc.onclose = () => {
            if (isConnected) { showToast('连接已断开', true); resetSendState(); }
          };
        }

        pc.oniceconnectionstatechange = () => {
          if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
            if (isConnected) { showToast('连接已断开', true); resetSendState(); }
          }
        };

        pc.onicecandidate = async (e) => {
          if (!e.candidate) {
            try {
              await api('/room/' + roomCode + '/offer', {
                method: 'PUT',
                body: JSON.stringify(pc.localDescription),
                headers: { 'Content-Type': 'text/plain' },
              });
            } catch(e) {}
            pollForAnswer();
          }
        };

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        setTimeout(async () => {
          if (pc && pc.localDescription && !pollTimer && !answerReceived) {
            try {
              await api('/room/' + roomCode + '/offer', {
                method: 'PUT',
                body: JSON.stringify(pc.localDescription),
                headers: { 'Content-Type': 'text/plain' },
              });
            } catch(e) {}
            pollForAnswer();
          }
        }, 1500);

      } catch (e) {
        showToast('创建失败: ' + e.message, true);
        resetSendState();
      }
    }

    async function pollForAnswer() {
      if (pollTimer || answerReceived) return;

      const doPoll = async () => {
        try {
          const data = await api('/room/' + roomCode + '/answer');
          if (data && data !== 'null') {
            answerReceived = true;
            clearTimeout(pollTimer);
            pollTimer = null;
            await pc.setRemoteDescription(new RTCSessionDescription(data));
            return true;
          }
        } catch(e) {}
        return false;
      };

      const found = await doPoll();
      if (found) return;

      const scheduleNext = () => {
        if (answerReceived || !pc || pc.signalingState === 'closed') return;
        pollTimer = setTimeout(async () => {
          const ok = await doPoll();
          if (!ok && !answerReceived) scheduleNext();
        }, 1500);
      };

      scheduleNext();

      setTimeout(() => {
        if (!answerReceived) {
          clearTimeout(pollTimer);
          pollTimer = null;
          if (!isConnected) {
            setSendConn('idle', '等待超时，请重试');
            showToast('接收方未加入', true);
            resetSendState();
          }
        }
      }, 30000);
    }

    // ===== SENDER: Multi-channel file transfer =====

    function waitBuf(dc) {
      return new Promise(resolve => {
        if (dc.bufferedAmount < MAX_BUFFER) resolve();
        else dc.addEventListener('bufferedamountlow', () => resolve(), { once: true });
      });
    }

    async function sendSegment(dc, data) {
      let off = 0;
      const len = data.byteLength;
      while (off < len) {
        await waitBuf(dc);
        const end = Math.min(off + CHUNK_SIZE, len);
        dc.send(data.slice(off, end));
        off = end;
      }
    }

    async function flushSendQueue() {
      if (sendingNow || !isConnected || pendingFiles.length === 0) return;

      sendingNow = true;
      $('sendFilesBtn').disabled = true;
      const pr = $('sendProgress');
      const pf = $('sendProgressFill');
      const pl = $('sendProgressLabel');
      const pp = $('sendProgressPct');
      pr.classList.add('show');

      const batch = pendingFiles.slice();
      pendingFiles = [];
      renderSendFiles();

      for (let fi = 0; fi < batch.length; fi++) {
        const file = batch[fi];
        const fileBuf = await file.arrayBuffer();
        const fsize = fileBuf.byteLength;
        const segSize = Math.ceil(fsize / NUM_CHANNELS);

        // Broadcast file metadata on channel 0
        dcs[0].send(JSON.stringify({
          type: 'file-start', name: file.name, size: fsize,
          mime: file.type || 'application/octet-stream',
          index: fi, total: batch.length, segments: NUM_CHANNELS, segSize
        }));

        // Send each segment on its channel in parallel
        const tasks = [];
        for (let ci = 0; ci < NUM_CHANNELS; ci++) {
          const start = ci * segSize;
          const end = Math.min(start + segSize, fsize);
          if (start >= fsize) break;
          const segData = fileBuf.slice(start, end);
          tasks.push(sendSegment(dcs[ci], segData));
        }
        await Promise.all(tasks);

        const pct = Math.round(((fi + 1) / batch.length) * 100);
        pf.style.width = pct + '%';
        pl.textContent = file.name + ' (' + (fi + 1) + '/' + batch.length + ')';
        pp.textContent = pct + '%';
      }

      dcs[0].send(JSON.stringify({ type: 'done' }));
      pf.style.width = '100%';
      pl.textContent = '✅ 全部发送完成';
      pp.textContent = '100%';
      showToast('文件发送完成');

      sendingNow = false;
      $('sendFilesBtn').disabled = false;

      if (pendingFiles.length > 0) {
        setTimeout(flushSendQueue, 500);
      }
    }

    // ===== SENDER: Manual send trigger =====
    $('sendFilesBtn').addEventListener('click', () => {
      if (pendingFiles.length === 0) { showToast('请先选择文件', true); return; }
      if (!isConnected) { showToast('连接未就绪', true); return; }
      flushSendQueue();
    });

    // ===== SENDER: Disconnect =====
    $('disconnectBtn').addEventListener('click', () => {
      cleanupRoom();
      resetSendState();
      showToast('已断开连接');
    });

    function resetSendState() {
      if (pc) { try { pc.close(); } catch(e) {} pc = null; }
      dcs = [];
      channelsOpen = 0;
      isConnected = false;
      sendingNow = false;
      answerReceived = false;
      clearTimeout(pollTimer); pollTimer = null;
      $('roomDisplay').classList.remove('show');
      $('disconnectBtn').style.display = 'none';
      $('sendFilesBtn').style.display = 'none';
      $('sendProgress').classList.remove('show');
      $('sendProgressFill').style.width = '0%';
      $('createRoomBtn').style.display = 'inline-flex';
      $('createRoomBtn').disabled = false;
      $('createRoomBtn').innerHTML = '<i class="fas fa-play"></i> 创建房间';
      setSendConn('idle', '未连接 — 选择文件并创建房间');
    }

    async function cleanupRoom() {
      if (roomCode) {
        try { await api('/room/' + roomCode, { method: 'DELETE' }); } catch(e) {}
        roomCode = '';
      }
    }

    function copyRoomCode() {
      const code = $('roomCode').textContent;
      navigator.clipboard.writeText(code).then(() => showToast('房间号已复制'))
        .catch(() => { const ta = document.createElement('textarea'); ta.value = code; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast('房间号已复制'); });
    }

    // ==================== RECEIVER ====================
    let recvPc = null;
    let recvDcs = [];       // Array of data channels indexed by label
    let recvConnected = false;
    let recvFilesDone = 0;
    let recvSegBufs = [];   // Per-channel byte buffers for current file
    let recvSegCount = 0;   // How many segments expected for current file

    $('roomInput').addEventListener('input', () => {
      const v = $('roomInput').value.replace(/\D/g, '').slice(0, 6);
      $('roomInput').value = v;
      $('joinBtn').disabled = v.length !== 6;
    });

    $('joinBtn').addEventListener('click', startJoin);

    async function startJoin() {
      const code = $('roomInput').value.trim();
      if (code.length !== 6) return;

      $('joinBtn').disabled = true;
      $('joinBtn').innerHTML = '<span class="spinner"></span> 连接中...';
      setRecvConn('waiting', '正在连接...', '房间 ' + code);

      try {
        const offerData = await api('/room/' + code + '/offer');
        if (!offerData || offerData === 'null') {
          setRecvConn('idle', '未找到该房间，请确认房间号');
          showToast('房间不存在', true);
          resetRecvState();
          return;
        }

        recvPc = new RTCPeerConnection({ iceServers: [{ urls: STUN }] });
        recvDcs = [];

        recvPc.ondatachannel = (event) => {
          const dc = event.channel;
          const label = dc.label || '';
          const ci = parseInt(label.split('-')[1]);
          if (!isNaN(ci) && ci >= 0 && ci < NUM_CHANNELS) {
            recvDcs[ci] = dc;
            setupRecvChannel(dc, ci);
          }
        };

        recvPc.oniceconnectionstatechange = () => {
          if (recvPc.iceConnectionState === 'connected' || recvPc.iceConnectionState === 'completed') {
            recvConnected = true;
            setRecvConn('connected', '已连接 — 等待文件传输', '房间 ' + code);
            $('recvJoinForm').style.display = 'none';
            $('recvWaiting').style.display = 'block';
            $('recvDisconnectBtn').style.display = 'inline-flex';
          }
          if (recvPc.iceConnectionState === 'disconnected' || recvPc.iceConnectionState === 'failed') {
            if (recvConnected) { showToast('连接已断开', true); resetRecvState(); }
          }
        };

        recvPc.onicecandidate = async (e) => {
          if (!e.candidate) {
            await api('/room/' + code + '/answer', {
              method: 'PUT',
              body: JSON.stringify(recvPc.localDescription),
              headers: { 'Content-Type': 'text/plain' },
            });
          }
        };

        await recvPc.setRemoteDescription(new RTCSessionDescription(offerData));
        const answer = await recvPc.createAnswer();
        await recvPc.setLocalDescription(answer);

        setTimeout(async () => {
          if (recvPc && recvPc.localDescription) {
            await api('/room/' + code + '/answer', {
              method: 'PUT',
              body: JSON.stringify(recvPc.localDescription),
              headers: { 'Content-Type': 'text/plain' },
            });
          }
        }, 1500);

      } catch (e) {
        setRecvConn('idle', '连接失败: ' + e.message);
        showToast('连接失败', true);
        resetRecvState();
      }
    }

    function setupRecvChannel(ch, ci) {
      const pr = $('recvProgress');
      const pf = $('recvProgressFill');
      const pl = $('recvProgressLabel');
      const pp = $('recvProgressPct');
      const rf = $('recvFiles');

      ch.binaryType = 'arraybuffer';

      // Per-channel state
      let chBufs = [];        // This channel's chunks for current segment
      let chReceived = 0;     // Bytes received on this channel
      let chSegSize = 0;      // Expected segment size

      ch.onmessage = (event) => {
        if (typeof event.data === 'string') {
          if (ci !== 0) return;  // Only channel 0 processes JSON

          try {
            const msg = JSON.parse(event.data);
            if (msg.type === 'file-start') {
              // Prepare for new file
              recvSegCount = msg.segments || 1;
              recvSegBufs = [];
              for (let s = 0; s < recvSegCount; s++) recvSegBufs[s] = [];
              pr.classList.add('show');
              pl.textContent = '接收: ' + msg.name;
              pp.textContent = '0%';
              pf.style.width = '0%';

              // Reset per-channel state
              for (let d = 0; d < recvDcs.length; d++) {
                if (recvDcs[d]) {
                  // Find the channel's internal state
                }
              }
              // Store file info globally
              setupRecvChannel._currentFile = msg;
              setupRecvChannel._fileSize = msg.size;

              // Set segment sizes per channel
              const segSize = msg.segSize || Math.ceil(msg.size / NUM_CHANNELS);
              for (let d = 0; d < recvDcs.length; d++) {
                if (recvDcs[d]) {
                  const start = d * segSize;
                  const end = Math.min(start + segSize, msg.size);
                  recvDcs[d]._segSize = end - start;
                  recvDcs[d]._bufs = [];
                  recvDcs[d]._received = 0;
                }
              }

            } else if (msg.type === 'done') {
              pf.style.width = '100%';
              pl.textContent = '✅ 接收完成';
              pp.textContent = '100%';
              showToast('文件接收完成！');
              setTimeout(() => {
                if (!setupRecvChannel._currentFile) pr.classList.remove('show');
              }, 3000);
            }
          } catch(e) {}
        } else {
          // Binary data
          const bytes = new Uint8Array(event.data);
          const buf = ch._bufs || [];
          buf.push(bytes);
          ch._bufs = buf;
          ch._received = (ch._received || 0) + bytes.length;

          // Check if this segment is complete
          const segSize = ch._segSize || 0;
          if (segSize > 0 && ch._received >= segSize) {
            // All channels done?
            let allDone = true;
            let totalBytes = 0;
            for (let d = 0; d < recvDcs.length; d++) {
              const dc = recvDcs[d];
              if (!dc) { allDone = false; break; }
              const r = dc._received || 0;
              const s = dc._segSize || 0;
              if (s > 0 && r < s) { allDone = false; }
              totalBytes += r;
            }

            if (allDone && setupRecvChannel._currentFile) {
              const file = setupRecvChannel._currentFile;
              const fsize = setupRecvChannel._fileSize || totalBytes;

              // Concatenate all segments
              const allParts = [];
              for (let d = 0; d < recvDcs.length; d++) {
                const dc = recvDcs[d];
                if (dc && dc._bufs) {
                  for (const b of dc._bufs) allParts.push(b);
                }
              }

              const allBytes = new Uint8Array(fsize);
              let pos = 0;
              for (const b of allParts) {
                allBytes.set(b, pos);
                pos += b.length;
              }

              const blob = new Blob([allBytes], { type: file.mime });
              const url = URL.createObjectURL(blob);
              recvFilesDone++;

              const icon = file.mime.startsWith('image/') ? 'fa-file-image' : file.mime.startsWith('video/') ? 'fa-file-video' : 'fa-file';
              if (recvFilesDone === 1) rf.innerHTML = '<div class="recv-header">📥 已接收文件:</div>';
              rf.innerHTML += '<div class="received-item">' +
                '<i class="fas ' + icon + ' r-icon"></i>' +
                '<div class="r-info"><div class="r-name">' + esc(file.name) + '</div><div class="r-size">' + fmtSize(blob.size) + '</div></div>' +
                '<a href="' + url + '" download="' + esc(file.name) + '" class="r-dl"><i class="fas fa-download"></i> 保存</a></div>';

              setupRecvChannel._currentFile = null;

              const pct = Math.round((recvFilesDone / (recvFilesDone + 1)) * 100);
              pf.style.width = Math.min(pct, 100) + '%';
            }

            // Update progress
            if (setupRecvChannel._currentFile) {
              const fsize = setupRecvChannel._fileSize || 1;
              let totalRcvd = 0;
              for (let d = 0; d < recvDcs.length; d++) {
                totalRcvd += recvDcs[d]?._received || 0;
              }
              const pct = Math.round((totalRcvd / fsize) * 100);
              pf.style.width = Math.min(pct, 100) + '%';
              pp.textContent = Math.min(pct, 100) + '%';
            }
          }
        }
      };

      ch.onclose = () => {
        if (recvConnected) { showToast('连接已断开', true); resetRecvState(); }
      };
    }

    function setRecvConn(state, text, badge = '') {
      const bar = $('recvConnBar');
      bar.className = 'conn-bar ' + state;
      $('recvConnText').textContent = text;
      $('recvConnBadge').textContent = badge;
    }

    $('recvDisconnectBtn').addEventListener('click', () => {
      resetRecvState();
      showToast('已断开连接');
    });

    function resetRecvState() {
      if (recvPc) { try { recvPc.close(); } catch(e) {} recvPc = null; }
      recvDcs = [];
      recvConnected = false;
      recvFilesDone = 0;
      recvSegBufs = [];
      recvSegCount = 0;

      $('joinBtn').disabled = false;
      $('joinBtn').innerHTML = '<i class="fas fa-plug"></i> 加入房间';
      $('recvJoinForm').style.display = 'block';
      $('recvWaiting').style.display = 'none';
      $('recvDisconnectBtn').style.display = 'none';
      $('recvProgress').classList.remove('show');
      setRecvConn('idle', '未连接 — 输入房间号加入');
    }

    // Cleanup on page leave
    window.addEventListener('beforeunload', () => {
      if (roomCode) {
        try { fetch(SIGNAL_URL + '/room/' + roomCode, { method: 'DELETE' }); } catch(e) {}
      }
      if (pc) try { pc.close(); } catch(e) {}
      if (recvPc) try { recvPc.close(); } catch(e) {}
    });
  </script>
</body>
