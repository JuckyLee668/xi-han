<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>跨设备剪切板</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Inter", "Microsoft YaHei", "PingFang SC", sans-serif;
      background: linear-gradient(135deg, #0f1324 0%, #1a1f3a 25%, #0d0f1f 50%, #1a1f3a 75%, #0f1324 100%);
      background-attachment: fixed;
      color: #f5f5ff;
      min-height: 100vh;
      padding: 20px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 50%, rgba(184, 160, 255, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(100, 200, 255, 0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .page-wrapper {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
    }

    .hero-card {
      background: rgba(22, 28, 48, 0.92);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
      backdrop-filter: blur(14px);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .back-link {
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .back-link:hover { color: #b8a0ff; }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header-icon {
      font-size: 2.8rem;
      color: #b8a0ff;
      margin-bottom: 12px;
      display: block;
    }

    h1 {
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #b8a0ff, #64c8ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .subtitle {
      color: rgba(255,255,255,0.55);
      font-size: 1rem;
    }

    .warning-notice {
      background: rgba(255, 200, 100, 0.1);
      border: 1px solid rgba(255, 200, 100, 0.2);
      color: #ffc864;
      padding: 14px 18px;
      border-radius: 12px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .warning-notice i { font-size: 1.1rem; }

    .input-section, .result-section {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      color: rgba(255,255,255,0.7);
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    .input-group label i {
      margin-right: 6px;
      color: #b8a0ff;
    }

    input, textarea {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      background: rgba(0,0,0,0.25);
      color: #f5f5ff;
      font-family: inherit;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #b8a0ff;
      background: rgba(0,0,0,0.35);
      box-shadow: 0 0 0 3px rgba(184, 160, 255, 0.1);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input::placeholder, textarea::placeholder {
      color: rgba(255,255,255,0.3);
    }

    .button-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 20px;
    }

    button {
      background: linear-gradient(135deg, #b8a0ff, #8b6fe8);
      color: white;
      padding: 13px 22px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 110px;
      justify-content: center;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(184, 160, 255, 0.3);
    }

    button:active { transform: translateY(0); }

    button.secondary {
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.7);
    }
    button.secondary:hover {
      background: rgba(255,255,255,0.12);
      box-shadow: none;
    }

    button.success {
      background: linear-gradient(135deg, #82dcaa, #5cc48a);
    }
    button.success:hover {
      box-shadow: 0 8px 24px rgba(130, 220, 170, 0.3);
    }

    .result-section h2 {
      font-size: 1.3rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #d8c4ff;
    }
    .result-section h2 i { color: #b8a0ff; }

    #result {
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 18px;
      font-family: Consolas, Monaco, 'Courier New', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      min-height: 100px;
      white-space: pre-wrap;
      word-break: break-all;
      color: rgba(255,255,255,0.8);
      transition: all 0.3s ease;
    }

    #result:empty::before {
      content: "结果将显示在这里...";
      color: rgba(255,255,255,0.3);
      font-style: italic;
    }

    .loading {
      display: none;
      text-align: center;
      color: #b8a0ff;
      font-weight: 600;
      margin: 16px 0;
    }

    .loading i {
      animation: spin 1s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .success-message, .error-message {
      padding: 12px 16px;
      border-radius: 12px;
      margin: 12px 0;
      display: none;
      align-items: center;
      gap: 8px;
      animation: slideIn 0.3s ease;
      font-size: 0.9rem;
    }

    .success-message {
      background: rgba(130, 220, 170, 0.1);
      color: #82dcaa;
      border: 1px solid rgba(130, 220, 170, 0.2);
    }

    .error-message {
      background: rgba(255, 107, 107, 0.1);
      color: #ff6b6b;
      border: 1px solid rgba(255, 107, 107, 0.2);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-12px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @media (max-width: 768px) {
      .hero-card { padding: 20px; border-radius: 18px; }
      .input-section, .result-section { padding: 18px; }
      .button-group { flex-direction: column; align-items: stretch; }
      button { justify-content: center; }
    }

    @media (min-width: 768px) {
      body { padding: 6vh 24px; }
      .hero-card { padding: 40px; border-radius: 32px; }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div class="hero-card">

      <div class="top-bar">
        <div></div>
        <a href="../html/tools.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回工具</a>
      </div>

      <div class="header">
        <i class="fas fa-cloud-upload-alt header-icon"></i>
        <h1>跨设备剪切板</h1>
        <p class="subtitle">安全便捷的云端剪切板服务</p>
      </div>

      <div class="warning-notice">
        <i class="fas fa-clock"></i>
        <span>数据保存时间为7天，到期自动删除，请及时备份重要内容</span>
      </div>

      <div class="input-section">
        <div class="input-group">
          <label for="key"><i class="fas fa-key"></i> 密钥 (Key)</label>
          <input id="key" type="text" placeholder="请输入唯一标识符，如：myClipboard2024" />
        </div>

        <div class="input-group">
          <label for="value"><i class="fas fa-edit"></i> 内容 (Content)</label>
          <textarea id="value" placeholder="请输入要保存的内容，支持文本、链接、代码等"></textarea>
        </div>

        <div class="button-group">
          <button id="save"><i class="fas fa-save"></i> 保存</button>
          <button id="retrieve" class="secondary"><i class="fas fa-download"></i> 获取</button>
          <button id="copy" class="success"><i class="fas fa-copy"></i> 复制</button>
        </div>

        <div class="loading" id="loading">
          <i class="fas fa-spinner"></i> 处理中...
        </div>

        <div class="success-message" id="successMessage">
          <i class="fas fa-check-circle"></i>
          <span></span>
        </div>

        <div class="error-message" id="errorMessage">
          <i class="fas fa-exclamation-circle"></i>
          <span></span>
        </div>
      </div>

      <div class="result-section">
        <h2><i class="fas fa-terminal"></i> 结果</h2>
        <pre id="result"></pre>
      </div>

    </div>
  </div>

  <script>
    const baseURL = 'https://api.xi-han.top';

    function showLoading() {
      document.getElementById('loading').style.display = 'block';
      hideMessages();
    }
    function hideLoading() { document.getElementById('loading').style.display = 'none'; }

    function showSuccess(message) {
      const div = document.getElementById('successMessage');
      div.querySelector('span').textContent = message;
      div.style.display = 'flex';
      setTimeout(() => { div.style.display = 'none'; }, 3000);
    }

    function showError(message) {
      const div = document.getElementById('errorMessage');
      div.querySelector('span').textContent = message;
      div.style.display = 'flex';
      setTimeout(() => { div.style.display = 'none'; }, 5000);
    }

    function hideMessages() {
      document.getElementById('successMessage').style.display = 'none';
      document.getElementById('errorMessage').style.display = 'none';
    }

    document.getElementById('save').addEventListener('click', async () => {
      const key = document.getElementById('key').value.trim();
      const value = document.getElementById('value').value.trim();
      if (!key) { showError('请输入密钥'); return; }
      if (!value) { showError('请输入要保存的内容'); return; }
      showLoading();
      try {
        const res = await fetch(`${baseURL}/save`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key, value }),
        });
        const t = await res.text();
        document.getElementById('result').textContent = t;
        res.ok ? showSuccess('保存成功！') : showError('保存失败：' + t);
      } catch(e) { showError('网络错误：' + e.message); document.getElementById('result').textContent = '网络连接失败'; }
      finally { hideLoading(); }
    });

    document.getElementById('retrieve').addEventListener('click', async () => {
      const key = document.getElementById('key').value.trim();
      if (!key) { showError('请输入密钥'); return; }
      showLoading();
      try {
        const res = await fetch(`${baseURL}/retrieve/${key}`);
        const t = await res.text();
        document.getElementById('result').textContent = t;
        res.ok ? showSuccess('获取成功！') : showError('未找到对应的数据');
      } catch(e) { showError('网络错误：' + e.message); document.getElementById('result').textContent = '网络连接失败'; }
      finally { hideLoading(); }
    });

    document.getElementById('copy').addEventListener('click', async () => {
      const text = document.getElementById('result').textContent.trim();
      if (!text || text === '结果将显示在这里...') { showError('没有可复制的内容'); return; }
      try {
        await navigator.clipboard.writeText(text);
        showSuccess('复制成功！');
      } catch(_) {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy');
        document.body.removeChild(ta);
        showSuccess('复制成功！');
      }
    });

    document.getElementById('key').addEventListener('keypress', e => {
      if (e.key === 'Enter') document.getElementById('retrieve').click();
    });
    document.getElementById('value').addEventListener('keypress', e => {
      if (e.key === 'Enter' && e.ctrlKey) document.getElementById('save').click();
    });
  </script>
</body>
</html>
